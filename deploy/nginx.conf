# A3：HTTP → HTTPS 强制跳转 + ACME 验证放行
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt HTTP-01 验证路径不重定向
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# A3：全站 HTTPS + HSTS + 现代 TLS 参数
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：启用后浏览器一年内强制 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # M8：CSP 与后端 helmet 策略保持一致（静态资源由 nginx 直接服务）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Brotli 压缩（需 ngx_brotli 模块）
    brotli on;
    brotli_vary on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # index.html: 短缓存 + no-cache，确保每次都能获取最新版本
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires 0;
            try_files $uri =404;
        }

        # 带 hash 的静态资源 (js/css 文件名包含 hash): 长期缓存 + immutable
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|avif)$ {
            # 匹配带 hash 的文件名 (如 app-xxxxxx.js, style-xxxxxx.css)
            if ($uri ~* "\.[a-f0-9]{8,}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|avif)$") {
                add_header Cache-Control "public, max-age=31536000, immutable";
                expires 1y;
                break;
            }
            # 非 hash 文件: 短缓存
            add_header Cache-Control "public, max-age=3600";
            expires 1h;
        }

        # 其他静态资源: 短缓存
        location ~* \.(json|xml|txt|webmanifest)$ {
            add_header Cache-Control "public, max-age=3600";
            expires 1h;
        }
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}