<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录/注册方案A · 单屏沉浸式</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#1c1410; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; font-family:"Noto Sans SC",sans-serif; }
  .phone { width:390px; height:844px; border-radius:44px; overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.6); border:10px solid #0c0c0c;
    background:linear-gradient(180deg,#ffd9b0 0%, #ffb3c1 38%, #c89bff 78%, #6a5acd 100%); }
  .sky { position:absolute; inset:0; background:radial-gradient(80% 50% at 50% 0%, rgba(255,255,255,.5), transparent 60%); }
  .sun { position:absolute; top:90px; left:50%; transform:translateX(-50%); width:120px; height:120px; border-radius:50%; background:radial-gradient(circle,#fff6e0,rgba(255,246,224,0)); }
  .petal { position:absolute; font-size:18px; opacity:.8; animation:fall 7s linear infinite; }
  @keyframes fall { to { transform:translateY(820px) rotate(360deg); opacity:0; } }
  .status { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:14px 26px; font-size:13px; color:#5a3a2a; font-weight:600; z-index:4; }
  .panel { position:absolute; left:0; right:0; bottom:0; height:560px; background:rgba(255,255,255,.72); backdrop-filter:blur(20px); border-radius:34px 34px 0 0; padding:30px 28px; box-shadow:0 -10px 40px rgba(0,0,0,.15); }
  .brand { font-family:"Noto Serif SC",serif; font-weight:700; font-size:30px; color:#3a2c2c; }
  .brand em { font-style:normal; color:#e0556e; }
  .tagline { font-size:13px; color:#7a5a52; margin-top:6px; font-weight:300; }
  .tabs { display:flex; gap:18px; margin:26px 0 18px; }
  .tab { font-size:16px; color:#9a7a72; font-weight:500; padding-bottom:6px; border-bottom:2px solid transparent; }
  .tab.on { color:#3a2c2c; font-weight:700; border-color:#e0556e; }
  .field { margin-bottom:18px; }
  .field label { display:block; font-size:12px; color:#7a5a52; margin-bottom:6px; }
  .field input { width:100%; border:none; border-bottom:1.5px solid rgba(58,44,44,.25); background:transparent; padding:8px 2px; font-size:16px; color:#3a2c2c; outline:none; }
  .field input:focus { border-color:#e0556e; }
  .opts { display:flex; justify-content:space-between; font-size:12px; color:#7a5a52; margin:4px 0 20px; }
  .btn { width:100%; padding:15px; border:none; border-radius:16px; background:linear-gradient(135deg,#e0556e,#c89bff); color:#fff; font-size:16px; font-weight:700; box-shadow:0 10px 24px rgba(224,85,110,.35); }
  .agree { font-size:11px; color:#7a5a52; margin-top:14px; text-align:center; }
  .agree a { color:#e0556e; }
  .note { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:10px; color:rgba(58,44,44,.5); z-index:4; }
</style>
</head>
<body>
  <div class="phone">
    <div class="sky"></div><div class="sun"></div>
    <div class="petal" style="left:20%;animation-delay:0s">🌸</div>
    <div class="petal" style="left:60%;animation-delay:2s">🌸</div>
    <div class="petal" style="left:80%;animation-delay:4s">💮</div>
    <div class="status"><span>9:41</span><span>●●● 5G ▮</span></div>
    <div class="panel">
      <div class="brand">和<em>我</em>恋爱吧</div>
      <div class="tagline">登录，继续你未完的暧昧</div>
      <div class="tabs"><div class="tab on">登录</div><div class="tab">注册</div></div>
      <div class="field"><label>手机号</label><input placeholder="请输入 11 位手机号" /></div>
      <div class="field"><label>密码</label><input type="password" placeholder="请输入密码" /></div>
      <div class="opts"><span>记住账号</span><span>忘记密码？</span></div>
      <button class="btn">登 录</button>
      <div class="agree">登录即代表同意 <a>用户协议</a> 与 <a>隐私政策</a></div>
    </div>
    <div class="note">卷轴收缩飞向左上头像的动画将保留</div>
  </div>
</body>
</html>
