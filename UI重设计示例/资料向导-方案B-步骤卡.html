<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>资料向导方案B · 极简步骤卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#15151a; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; font-family:"Noto Sans SC",sans-serif; }
  .phone { width:390px; height:844px; border-radius:44px; overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.55); border:10px solid #0c0c0c; background:#f6f4ef; }
  .status { display:flex; justify-content:space-between; padding:14px 26px 4px; font-size:13px; color:#333; font-weight:600; }
  .title { font-family:"Noto Serif SC",serif; font-weight:900; font-size:26px; color:#1c1c22; padding:14px 24px 2px; }
  .sub { font-size:13px; color:#999; padding:0 24px 14px; }
  .spine { position:absolute; left:30px; top:150px; bottom:120px; width:2px; background:#e3ddd2; }
  .node { position:absolute; left:24px; width:14px; height:14px; border-radius:50%; background:#e3ddd2; border:3px solid #f6f4ef; }
  .node.n1 { top:150px; background:#ff7a9c; }
  .node.n2 { top:300px; }
  .node.n3 { top:450px; }
  .card { position:absolute; left:54px; right:24px; background:#fff; border-radius:18px; padding:20px; box-shadow:0 6px 20px rgba(0,0,0,.06); }
  .card.c1 { top:138px; border:2px solid #ff7a9c; }
  .card.c2 { top:288px; opacity:.55; }
  .card.c3 { top:438px; opacity:.55; }
  .card .step { font-size:11px; letter-spacing:2px; color:#ff7a9c; font-weight:700; }
  .card .q { font-family:"Noto Serif SC",serif; font-weight:700; font-size:19px; color:#1c1c22; margin:4px 0 14px; }
  .choices { display:flex; gap:12px; }
  .ch { flex:1; border:1.5px solid #ececec; border-radius:14px; padding:18px 0; text-align:center; font-size:16px; font-weight:500; color:#444; }
  .ch.on { border-color:#ff7a9c; background:#fff0f4; color:#ff7a9c; font-weight:700; }
  .ch .ic { font-size:26px; display:block; margin-bottom:6px; }
  .card .mini { font-size:12px; color:#aaa; margin-top:12px; }
  .next { position:absolute; left:24px; right:24px; bottom:28px; padding:15px; border:none; border-radius:16px; background:#1c1c22; color:#fff; font-size:16px; font-weight:700; }
  .foot { position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:10px; color:#bbb; }
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● 5G ▮</span></div>
    <div class="title">先聊聊你</div>
    <div class="sub">三步，遇见对的人</div>
    <div class="spine"></div>
    <div class="node n1"></div><div class="node n2"></div><div class="node n3"></div>

    <div class="card c1">
      <div class="step">STEP 01</div>
      <div class="q">你的性别是？</div>
      <div class="choices"><div class="ch on"><span class="ic">♂</span>男生</div><div class="ch"><span class="ic">♀</span>女生</div></div>
    </div>
    <div class="card c2">
      <div class="step">STEP 02</div>
      <div class="q">你希望 TA 是？</div>
      <div class="mini">男生 / 女生</div>
    </div>
    <div class="card c3">
      <div class="step">STEP 03</div>
      <div class="q">TA 的性格</div>
      <div class="mini">16 型 MBTI · 随机 · 渣男/渣女变体 ✦</div>
    </div>

    <button class="next">下一步 →</button>
    <div class="foot">极简步骤卡 · 一步一景，竖向进度脊</div>
  </div>
</body>
</html>
