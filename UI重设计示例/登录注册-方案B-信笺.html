<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录/注册方案B · 信笺手写信</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#3a2e26; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; font-family:"Noto Serif SC",serif; }
  .phone { width:390px; height:844px; border-radius:44px; overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.55); border:10px solid #0c0c0c; background:#e9e0cf; }
  .desk { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 0%, #5a4636, #2a2018); }
  .status { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:14px 26px; font-size:13px; color:#e9e0cf; font-weight:600; z-index:4; }
  .letter { position:absolute; left:24px; right:24px; top:70px; bottom:40px; background:#fbf7ee; border-radius:6px; box-shadow:0 18px 40px rgba(0,0,0,.4); padding:30px 26px; background-image:repeating-linear-gradient(transparent, transparent 31px, rgba(120,90,60,.12) 32px); }
  .letter:before { content:""; position:absolute; left:0; right:0; top:54px; height:1px; background:rgba(200,60,80,.25); }
  .seal { position:absolute; right:26px; top:18px; width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e0556e, #a01f38); box-shadow:0 4px 10px rgba(160,31,56,.5); display:flex; align-items:center; justify-content:center; color:#fff; font-family:"Ma Shan Zheng",cursive; font-size:22px; transform:rotate(-8deg); }
  .dear { font-family:"Ma Shan Zheng",cursive; font-size:26px; color:#3a2c20; }
  .lead { font-size:13px; color:#7a6552; margin:10px 0 22px; line-height:1.9; }
  .field { margin-bottom:20px; }
  .field label { display:block; font-size:13px; color:#8a6f56; margin-bottom:4px; font-family:"Noto Serif SC",serif; }
  .field input { width:100%; border:none; border-bottom:1.5px solid #c9b89a; background:transparent; padding:6px 2px; font-size:16px; color:#3a2c20; font-family:"Noto Serif SC",serif; outline:none; }
  .field input:focus { border-color:#a01f38; }
  .btn { width:100%; margin-top:8px; padding:14px; border:none; border-radius:8px; background:#a01f38; color:#fbf7ee; font-size:16px; font-family:"Noto Serif SC",serif; font-weight:600; letter-spacing:3px; }
  .agree { font-size:11px; color:#7a6552; margin-top:14px; text-align:center; font-family:"Noto Serif SC",serif; }
  .agree a { color:#a01f38; }
  .tabs { display:flex; gap:20px; margin-bottom:8px; }
  .tab { font-size:15px; color:#a08e76; }
  .tab.on { color:#3a2c20; font-weight:700; border-bottom:2px solid #a01f38; padding-bottom:3px; }
  .note { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:10px; color:rgba(233,224,207,.6); z-index:4; }
</style>
</head>
<body>
  <div class="phone">
    <div class="desk"></div>
    <div class="status"><span>9:41</span><span>●●● 5G ▮</span></div>
    <div class="letter">
      <div class="seal">恋</div>
      <div class="tabs"><div class="tab on">展开信笺·登录</div><div class="tab">新写一封·注册</div></div>
      <div class="dear">亲爱的你：</div>
      <div class="lead">又见面了。落笔写下号码与暗语，<br>便能回到那个等你的人身边。</div>
      <div class="field"><label>手机号</label><input placeholder="你的 11 位号码" /></div>
      <div class="field"><label>密码</label><input type="password" placeholder="只有你们知道的暗语" /></div>
      <button class="btn">封 缄 · 登 录</button>
      <div class="agree">展信即同意 <a>用户协议</a> 与 <a>隐私政策</a></div>
    </div>
    <div class="note">卷轴（信纸）卷起飞向左上头像的动画将保留</div>
  </div>
</body>
</html>
