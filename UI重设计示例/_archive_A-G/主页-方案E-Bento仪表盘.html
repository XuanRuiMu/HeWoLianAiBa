<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>主页方案E · Bento 仪表盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b21;
    --ink: #f1f2f4;
    --muted: #8b92a3;
    --green: #4ade80;
    --pink: #fb7185;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 18px;
    --space-lg: 28px;
    --space-xl: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .app {
    container-type: inline-size;
    width: 100%;
    min-height: 100vh;
    padding: var(--space-md);
  }

  /* Mobile: stacked tiles */
  .dashboard {
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: var(--space-xs);
  }
  .header h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .header .sub { font-size: 12px; color: var(--muted); }
  .tile {
    background: var(--panel);
    border-radius: 24px;
    padding: var(--space-md);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.06);
    transition: transform .2s ease, border-color .2s ease;
  }
  .tile:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.12); }
  .tile.hero {
    min-height: 360px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    cursor: default;
  }
  .tile.hero:hover { transform: none; border-color: rgba(255,255,255,.06); }
  .tile.hero img {
    position: absolute;
    bottom: -20px;
    right: -30px;
    height: 90%;
    width: auto;
    object-fit: contain;
    object-position: right bottom;
  }
  .tile.hero .label {
    position: relative;
    z-index: 2;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--green);
    margin-bottom: var(--space-xs);
  }
  .tile.hero .name {
    position: relative;
    z-index: 2;
    font-family: "Space Grotesk", sans-serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .tile.hero .tagline {
    position: relative;
    z-index: 2;
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }
  .tile.action {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
  }
  .tile.action .top {
    display: flex; align-items: center; gap: var(--space-sm);
  }
  .tile.action .icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .tile.action.primary .icon { background: rgba(74,222,128,.15); color: var(--green); }
  .tile.action.secondary .icon { background: rgba(251,113,133,.15); color: var(--pink); }
  .tile.action h3 { font-size: 18px; font-weight: 700; }
  .tile.action p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tile.action .arrow {
    align-self: flex-end;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.08);
    color: var(--ink);
    transition: background .2s ease, transform .2s ease;
  }
  .tile.action:hover .arrow { background: rgba(255,255,255,.16); transform: translateX(3px); }
  .tile.action.soon { opacity: .55; cursor: not-allowed; }
  .tile.action.soon:hover { transform: none; }
  .tile.action.soon:hover .arrow { transform: none; }
  .mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
  }
  .tile.stat {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 120px;
  }
  .tile.stat .num {
    font-family: "Space Grotesk", sans-serif;
    font-size: 36px;
    font-weight: 700;
  }
  .tile.stat .num.green { color: var(--green); }
  .tile.stat .num.pink { color: var(--pink); }
  .tile.stat .label { font-size: 12px; color: var(--muted); }
  .footer {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: var(--space-sm) 0;
  }

  /* Desktop: bento grid */
  @container (min-width: 760px) {
    .app { padding: var(--space-xl); }
    .dashboard {
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: minmax(160px, auto);
      gap: var(--space-md);
    }
    .header { grid-column: 1 / -1; margin-bottom: 0; }
    .header h1 { font-size: 42px; }
    .tile.hero {
      grid-column: 1 / 3;
      grid-row: 2 / 4;
      min-height: auto;
    }
    .tile.hero img { height: 95%; right: -40px; }
    .tile.action.primary { grid-column: 3 / 5; }
    .tile.action.secondary { grid-column: 3 / 4; }
    .tile.stat { grid-column: auto; }
    .mini { grid-column: 1 / -1; display: contents; }
    .footer { grid-column: 1 / -1; text-align: left; }
  }

  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: var(--space-md);
    font-size: 13px; color: var(--muted); text-decoration: none;
  }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="app">
    <a class="back" href="体验中心.html">← 返回体验中心</a>
    <div class="dashboard">
      <div class="header">
        <div>
          <h1>欢迎回来</h1>
          <div class="sub">今天想怎么开始？</div>
        </div>
        <div class="sub">9:41</div>
      </div>

      <div class="tile hero">
        <img src="吴昊阳终稿静态图.png" alt="吴昊阳" />
        <div class="label">Featured</div>
        <div class="name">吴昊阳</div>
        <div class="tagline">正在线上 · 等你开口</div>
      </div>

      <div class="tile action primary" onclick="alert('进入普通模式')">
        <div class="top">
          <span class="icon">♡</span>
          <div>
            <h3>普通模式</h3>
            <p>自定义对象 · 适合新手</p>
          </div>
        </div>
        <span class="arrow">→</span>
      </div>

      <div class="tile action secondary soon">
        <div class="top">
          <span class="icon">⚡</span>
          <div>
            <h3>挑战模式</h3>
            <p>系统随机 · 分数排行</p>
          </div>
        </div>
        <span class="arrow"> soon</span>
      </div>

      <div class="mini">
        <div class="tile stat">
          <div class="num green">10</div>
          <div class="label">轮次即可心动</div>
        </div>
        <div class="tile stat">
          <div class="num pink">16</div>
          <div class="label">MBTI 类型可选</div>
        </div>
      </div>

      <div class="tile stat">
        <div class="num blue">∞</div>
        <div class="label">对话可能</div>
      </div>

      <div class="footer">Bento 仪表盘 · 把主页变成你的恋爱中控</div>
    </div>
  </div>
</body>
</html>
