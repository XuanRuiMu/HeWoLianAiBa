<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>主页方案A · 微信原生拟态</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f7f5f0;
    --ink: #1f1c18;
    --wx: #07c160;
    --line: rgba(0,0,0,.08);
    --muted: #8a8378;
    --card: #ffffff;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.04);
    --shadow-md: 0 8px 24px rgba(0,0,0,.08);
    --space-xs: 6px;
    --space-sm: 10px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 40px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans SC", sans-serif;
    background: #e8e4dc;
    color: var(--ink);
  }
  .app {
    container-type: inline-size;
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  /* Mobile: single-column app */
  .mobile-shell {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-md);
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    padding: 14px var(--space-md) 6px;
    font-size: 13px;
    font-weight: 600;
  }
  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-sm) var(--space-md) var(--space-md);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 19px; letter-spacing: 1px; }
  .me-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg,#ffb3c1,#ff7a9c);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
  }
  .scroll {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-md);
  }
  .greeting {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: var(--space-md);
  }
  .greeting b { color: var(--ink); font-weight: 700; }
  .section-title {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: var(--space-lg) 0 var(--space-sm);
  }
  .contact-card {
    display: flex;
    gap: var(--space-md);
    background: var(--card);
    border-radius: 18px;
    padding: var(--space-md);
    align-items: center;
    box-shadow: var(--shadow-sm);
    margin-bottom: var(--space-md);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .contact-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .contact-avatar {
    width: 56px; height: 56px; border-radius: 14px;
    object-fit: cover; flex-shrink: 0;
    background: #f0e6dd;
  }
  .contact-name { font-weight: 700; font-size: 16px; }
  .contact-status {
    font-size: 12px; color: var(--muted); margin-top: 3px;
    display: flex; align-items: center; gap: 5px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--wx); }
  .badge {
    margin-left: auto;
    background: #ffe9ef; color: #e8436b;
    font-size: 11px; padding: 4px 9px; border-radius: 20px; font-weight: 700;
  }
  .mode-row {
    display: flex; align-items: center; gap: var(--space-md);
    background: var(--card);
    border-radius: 16px;
    padding: 15px var(--space-md);
    margin-bottom: var(--space-sm);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .mode-row:hover { transform: translateX(4px); border-color: rgba(7,193,96,.25); box-shadow: var(--shadow-md); }
  .mode-row.soon:hover { transform: translateX(0); border-color: transparent; }
  .mode-icon {
    width: 42px; height: 42px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; flex-shrink: 0;
  }
  .mode-icon.a { background: linear-gradient(135deg,#5b8def,#7c5cff); }
  .mode-icon.b { background: linear-gradient(135deg,#ff8a5b,#ff5e8e); }
  .mode-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .tag {
    font-size: 10px; color: #fff; background: var(--wx);
    border-radius: 5px; padding: 1px 5px;
  }
  .mode-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mode-arrow { margin-left: auto; color: #c9c2b6; font-size: 18px; }
  .soon-label {
    margin-left: auto;
    font-size: 11px; background: #eee; color: #999;
    padding: 3px 8px; border-radius: 12px;
  }

  /* Desktop: WeChat desktop app split */
  @container (min-width: 760px) {
    .mobile-shell {
      max-width: 1100px;
      flex-direction: row;
      min-height: 90vh;
      margin: 5vh auto;
      border-radius: 12px;
      overflow: hidden;
    }
    .status-bar, .top-nav { display: none; }
    .sidebar {
      width: 280px;
      background: #f2f2f2;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: var(--space-md) 0;
    }
    .sidebar-head {
      padding: 0 var(--space-md) var(--space-md);
      border-bottom: 1px solid var(--line);
      font-family: "Noto Serif SC", serif;
      font-weight: 700; font-size: 18px;
      display: flex; align-items: center; gap: var(--space-sm);
    }
    .sidebar-head .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--wx); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .chat-list { flex: 1; overflow-y: auto; padding-top: var(--space-sm); }
    .chat-item {
      display: flex; align-items: center; gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      cursor: pointer;
      transition: background .15s ease;
    }
    .chat-item:hover { background: #e6e6e6; }
    .chat-item.active { background: #d9d9d9; }
    .chat-item img {
      width: 42px; height: 42px; border-radius: 10px; object-fit: cover;
    }
    .chat-meta { flex: 1; min-width: 0; }
    .chat-name { font-weight: 700; font-size: 14px; }
    .chat-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-time { font-size: 11px; color: #bbb; }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }
    .main-header {
      padding: var(--space-md) var(--space-xl);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: var(--space-sm);
    }
    .main-header img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
    .main-header .name { font-weight: 700; font-size: 16px; }
    .main-header .status { font-size: 12px; color: var(--wx); margin-left: auto; display: flex; align-items: center; gap: 5px; }
    .main-body {
      flex: 1;
      padding: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      overflow-y: auto;
    }
    .bubble {
      align-self: flex-start;
      max-width: 460px;
      background: #fff;
      border-radius: 18px;
      padding: var(--space-md) var(--space-lg);
      box-shadow: var(--shadow-sm);
      font-size: 15px;
      line-height: 1.6;
      position: relative;
    }
    .bubble::before {
      content: ""; position: absolute; left: -6px; top: 18px;
      width: 12px; height: 12px; background: #fff;
      transform: rotate(45deg);
    }
    .bubble b { font-weight: 700; }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
      margin-top: auto;
    }
    .action-card {
      background: #fff;
      border-radius: 18px;
      padding: var(--space-lg);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .action-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .action-card.primary { border-color: rgba(7,193,96,.2); }
    .action-card.primary:hover { border-color: rgba(7,193,96,.4); }
    .action-card.soon { opacity: .65; cursor: not-allowed; }
    .action-card .top {
      display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-sm);
    }
    .action-card .ic {
      width: 38px; height: 38px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
    }
    .action-card.primary .ic { background: linear-gradient(135deg,#5b8def,#7c5cff); }
    .action-card.secondary .ic { background: linear-gradient(135deg,#ff8a5b,#ff5e8e); }
    .action-card h4 { font-size: 15px; font-weight: 700; }
    .action-card p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  }

  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin: var(--space-md);
    font-size: 13px; color: var(--muted); text-decoration: none;
  }
  .back:hover { color: var(--ink); }
  @container (min-width: 760px) {
    .back { position: absolute; top: 8px; left: 8px; margin: 0; color: #fff; background: rgba(0,0,0,.5); padding: 6px 12px; border-radius: 20px; }
    .back:hover { color: #fff; background: rgba(0,0,0,.7); }
  }
</style>
</head>
<body>
  <a class="back" href="体验中心.html">← 返回体验中心</a>
  <div class="app">
    <div class="mobile-shell">
      <!-- mobile header -->
      <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
      <div class="top-nav"><span class="brand">和我恋爱吧</span><span class="me-avatar">我</span></div>

      <!-- desktop sidebar -->
      <div class="sidebar">
        <div class="sidebar-head"><span class="logo">恋</span>和我恋爱吧</div>
        <div class="chat-list">
          <div class="chat-item active">
            <img src="吴昊阳终稿静态图.png" alt="吴昊阳" />
            <div class="chat-meta"><div class="chat-name">吴昊阳</div><div class="chat-preview">今天也想谈场恋爱吗？</div></div>
            <div class="chat-time">刚刚</div>
          </div>
          <div class="chat-item">
            <div class="me-avatar" style="width:42px;height:42px;border-radius:10px;">我</div>
            <div class="chat-meta"><div class="chat-name">个人资料</div><div class="chat-preview">点击设置头像与昵称</div></div>
          </div>
        </div>
      </div>

      <!-- main content -->
      <div class="main">
        <div class="main-header">
          <img src="吴昊阳终稿静态图.png" alt="吴昊阳" />
          <span class="name">吴昊阳</span>
          <span class="status"><span class="status-dot"></span>在线</span>
        </div>

        <div class="scroll">
          <div class="greeting">欢迎回来，<b>今天也想谈场恋爱吗</b></div>

          <!-- contact only on mobile -->
          <div class="contact-card mobile-only">
            <img class="contact-avatar" src="吴昊阳终稿静态图.png" alt="吴昊阳" />
            <div>
              <div class="contact-name">吴昊阳</div>
              <div class="contact-status"><span class="status-dot"></span>刚刚上线 · 在等你开口</div>
            </div>
            <div class="badge">新消息</div>
          </div>

          <div class="section-title">选择一种开始方式</div>

          <div class="mode-row" onclick="alert('进入普通模式')">
            <div class="mode-icon a">♡</div>
            <div>
              <div class="mode-title">普通模式<span class="tag">推荐</span></div>
              <div class="mode-desc">自定义对象 · 适合新手</div>
            </div>
            <div class="mode-arrow">›</div>
          </div>

          <div class="mode-row soon">
            <div class="mode-icon b">⚡</div>
            <div>
              <div class="mode-title">挑战模式</div>
              <div class="mode-desc">系统随机 · 分数计入排行</div>
            </div>
            <div class="soon-label">即将推出</div>
          </div>
        </div>

        <!-- desktop action cards -->
        <div class="main-body">
          <div class="bubble"><b>吴昊阳：</b>欢迎回来——有人正在屏幕那头等你。今天想从哪种方式开始？</div>
          <div class="action-grid">
            <div class="action-card primary" onclick="alert('进入普通模式')">
              <div class="top"><span class="ic">♡</span><h4>普通模式</h4><span class="tag">推荐</span></div>
              <p>自定义对象 · 适合新手</p>
            </div>
            <div class="action-card secondary soon">
              <div class="top"><span class="ic">⚡</span><h4>挑战模式</h4></div>
              <p>系统随机 · 分数计入排行 · 即将推出</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <style>
    @container (min-width: 760px) {
      .mobile-only { display: none !important; }
    }
    @container (max-width: 759px) {
      .sidebar { display: none !important; }
      .main-header { display: none !important; }
      .main-body { display: none !important; }
    }
  </style>
</body>
</html>
