<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eee8dc" />
    <title>纸间 · 过渡页方向 03</title>
    <link rel="stylesheet" href="./vendor/epic-spinners/semipolar.css" />
    <link rel="stylesheet" href="./styles.css" />
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="is-loading">
    <main class="destination">
      <nav class="nav reveal">
        <a class="brand" href="../index.html" aria-label="返回方向选择"
          >和我恋爱吧</a
        >
        <span class="folio">VOL. 03 · A QUIET PAUSE</span>
      </nav>
      <section class="hero">
        <p class="overline reveal">Read between the lines</p>
        <h1 class="reveal">每一句喜欢，<br />都值得被<em>慢慢读。</em></h1>
        <div class="hero-foot reveal">
          <p>留一点空白，让心意自己浮现。这里不赶时间。</p>
          <button class="replay" type="button" data-replay>重播过渡</button>
        </div>
      </section>
      <footer class="foot reveal">
        <span>第 001 页 / 共一生</span>
        <span>Printed for two</span>
      </footer>
    </main>

    <section
      class="loader-overlay"
      role="status"
      aria-live="polite"
      aria-label="正在加载"
    >
      <div class="loader-wrap">
        <header class="loader-nav">
          <span class="loader-brand">和我恋爱吧</span>
          <span class="loader-index">LOADING / 03</span>
        </header>
        <div class="loader-grid">
          <div class="loader-title">
            <p>Please wait a moment</p>
            <h2>正在<br />加载<span>。</span></h2>
            <small>让这一页慢慢展开</small>
          </div>
          <div class="loader-side">
            <div class="spinner-wrap" aria-hidden="true">
              <div class="semipolar-spinner">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
              </div>
            </div>
            <div class="loader-count">
              <b data-progress>00</b><span>%</span>
            </div>
          </div>
        </div>
        <footer class="loader-footer">
          <div class="loader-track"><i data-progress-bar></i></div>
          <div class="loader-meta">
            <span>COMPOSING YOUR STORY</span>
            <span>EST. MMXXVI</span>
          </div>
        </footer>
      </div>
    </section>

    <script src="./main.js"></script>
  </body>
</html>
