<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>06 心幕 · 爱心按左上→右下→中间覆盖</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="舞臺">
      <section class="頁面 頁面--甲" data-ye="甲">
        <p class="頁標">过往战绩</p>
        <h1>并肩走过的每一局</h1>
        <p class="頁註">爱心按 左上 → 右下 → 中间 依次绽放铺满</p>
      </section>
      <section class="頁面 頁面--乙" data-ye="乙" hidden>
        <p class="頁標">主页</p>
        <h1>回到你们的聊天</h1>
        <p class="頁註">同序收回，丝滑交还画面</p>
      </section>
    </main>

    <svg class="色谱" aria-hidden="true">
      <defs>
        <linearGradient id="xin-luo" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#ff9ebc" />
          <stop offset="100%" stop-color="#ff6b9d" />
        </linearGradient>
        <linearGradient id="xin-mei" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#ff6b9d" />
          <stop offset="100%" stop-color="#c9184a" />
        </linearGradient>
        <linearGradient id="xin-jin" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#f6d5c0" />
          <stop offset="100%" stop-color="#e8a87c" />
        </linearGradient>
        <linearGradient id="xin-zi" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#b06ab3" />
          <stop offset="100%" stop-color="#6a3f8f" />
        </linearGradient>
      </defs>
    </svg>

    <div class="心幕" data-xinmu aria-hidden="true">
      <div class="幕布" data-mubu></div>
      <div class="心層" data-xinceng></div>
    </div>

    <div class="控制臺">
      <button type="button" data-bofang>播放完整顺序</button>
      <span class="階段" data-jieduan>待命</span>
    </div>

    <script src="vendor/gsap.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
