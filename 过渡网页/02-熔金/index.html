<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080807" />
    <title>熔金 · 过渡页方向 02</title>
    <link rel="stylesheet" href="./styles.css" />
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="is-loading">
    <main class="destination">
      <nav class="nav reveal">
        <a class="brand" href="../index.html" aria-label="返回方向选择">
          <span class="brand-dot" aria-hidden="true"></span>
          和我恋爱吧
        </a>
        <span class="edition">After hours / 02</span>
      </nav>
      <section class="hero">
        <p class="kicker reveal">The night is still young</p>
        <h1 class="reveal">夜已经深了，<br /><em>故事才刚刚开始。</em></h1>
        <div class="row reveal">
          <p>有些话适合在夜里说。灯光暗下来，距离就近了。</p>
          <button class="replay" type="button" data-replay>重播过渡</button>
        </div>
      </section>
      <footer class="foot reveal">
        <span>一段只属于两个人的时间</span>
        <span>Hong Kong · 23:48</span>
      </footer>
    </main>

    <div
      class="loader-overlay"
      role="status"
      aria-live="polite"
      aria-label="正在加载"
    >
      <div class="veil" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="loader-content">
        <header class="loader-head">
          <span class="loader-brand">HE WOLIANAIBA</span>
          <img
            class="signal"
            src="./vendor/svg-spinners/12-dots-scale-rotate.svg"
            alt=""
            width="24"
            height="24"
          />
        </header>
        <div class="loader-core">
          <div class="meter" data-meter>
            <img
              class="gooey"
              src="./vendor/svg-spinners/gooey-balls-1.svg"
              alt=""
              width="24"
              height="24"
            />
          </div>
          <p class="loader-copy">正在加载</p>
        </div>
        <footer class="loader-foot">
          <span class="counter"
            ><b data-progress>000</b><small> / 100</small></span
          >
          <div class="rule"><i data-progress-bar></i></div>
          <span class="whisper">A little longer</span>
        </footer>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
