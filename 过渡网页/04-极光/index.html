<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071315" />
    <title>极光 · 过渡页方向 04</title>
    <link rel="stylesheet" href="./styles.css" />
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="is-loading">
    <main class="destination">
      <nav class="nav reveal">
        <a class="brand" href="../index.html" aria-label="返回方向选择">
          <span class="brand-gem" aria-hidden="true"></span>
          和我恋爱吧
        </a>
        <span class="nav-meta">SYSTEM / READY</span>
      </nav>
      <section class="hero">
        <p class="kicker reveal">Connection restored</p>
        <h1 class="reveal">回到<br /><em>你们的故事。</em></h1>
        <div class="hero-foot reveal">
          <p>所有对话、心情和没说完的话，都还在原来的地方。</p>
          <button class="replay" type="button" data-replay>重播过渡</button>
        </div>
      </section>
      <footer class="foot reveal">
        <span>私人频道 · 已加密</span>
        <span>Signal stable</span>
      </footer>
    </main>

    <section
      class="loader-overlay"
      role="status"
      aria-live="polite"
      aria-label="正在加载"
    >
      <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="grid-noise" aria-hidden="true"></div>
      <div class="loader-wrap">
        <header class="loader-head">
          <span class="loader-brand">HE WOLIANAIBA</span>
          <span class="loader-tag">SECURE CONNECTION</span>
        </header>
        <div class="loader-main">
          <p class="loader-kicker">CALIBRATING THE MOMENT</p>
          <h2>正在连接<span>。</span></h2>
          <div class="loader-stage">
            <div class="glass-panel">
              <img
                class="wave"
                src="./vendor/svg-spinners/blocks-wave.svg"
                alt=""
                width="24"
                height="24"
              />
            </div>
            <div class="loader-readout">
              <b data-progress>00</b><span>%</span>
              <small>PRIVATE CHANNEL</small>
            </div>
          </div>
        </div>
        <footer class="loader-foot">
          <span>01 / RESTORING MEMORY</span>
          <div class="loader-track"><i data-progress-bar></i></div>
          <span>02 / OPENING HEART</span>
        </footer>
      </div>
    </section>

    <script src="./main.js"></script>
  </body>
</html>
