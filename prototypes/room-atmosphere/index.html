<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和我恋爱吧 · 深夜房间氛围原型</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
          },
          colors: {
            room: {
              bg: '#1a0f14',
              panel: 'rgba(30, 18, 24, 0.72)',
              border: 'rgba(255, 255, 255, 0.08)',
              text: '#f8f4f2',
              muted: 'rgba(248, 244, 242, 0.45)',
              accent: '#ff7a8a',
              accent2: '#6b8cff',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #1a0f14;
      --bg-panel: rgba(30, 18, 24, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8f4f2;
      --muted: rgba(248, 244, 242, 0.45);
      --accent: #ff7a8a;
      --accent2: #6b8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #2a1a22;
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 30%, transparent 0%, rgba(20, 10, 14, 0.55) 70%, rgba(15, 8, 12, 0.85) 100%);
    }

    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .ui-layer {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .glass {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }

    .nav-glass {
      background: rgba(26, 15, 20, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .mode-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .mode-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .mode-card.normal:hover {
      box-shadow: 0 20px 50px rgba(107, 140, 255, 0.12);
    }

    .mode-card.challenge:hover {
      box-shadow: 0 20px 50px rgba(255, 122, 138, 0.12);
    }

    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-circle.normal {
      background: linear-gradient(135deg, rgba(107,140,255,0.22), rgba(147,130,186,0.12));
    }

    .icon-circle.challenge {
      background: linear-gradient(135deg, rgba(255,122,138,0.22), rgba(251,146,60,0.12));
    }

    .character-img {
      max-height: calc(100vh - 280px);
      width: auto;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 50px rgba(0,0,0,0.45));
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .character-img:hover {
      transform: scale(1.02);
    }

    .title-word {
      background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.72) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .glow-text {
      text-shadow: 0 0 40px rgba(255,122,138,0.15);
    }

    .arrow-icon {
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0.35;
    }

    .mode-card:hover .arrow-icon {
      transform: translateX(4px);
      opacity: 0.9;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.normal { background: var(--accent2); box-shadow: 0 0 6px rgba(107,140,255,0.4); }
    .dot.challenge { background: var(--accent); box-shadow: 0 0 6px rgba(255,122,138,0.4); }

    .phone-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(107,140,255,0.35) 0%, transparent 70%);
      filter: blur(20px);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.08); }
    }

    .menu-btn, .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .menu-btn:hover, .theme-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.16);
    }

    @media (max-width: 1023px) {
      .character-img { max-height: 36vh; }
    }

    @media (max-width: 767px) {
      .character-img { max-height: 28vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .character-img, .mode-card, .arrow-icon, .menu-btn, .theme-btn {
        transition: none !important;
        animation: none !important;
      }
      .mode-card:hover { transform: none; }
      .phone-glow { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div class="ui-layer">
    <!-- Nav -->
    <nav class="nav-glass fixed top-0 left-0 right-0 z-50 px-5 md:px-8 h-14 md:h-[52px] flex items-center justify-between">
      <div class="flex items-center gap-2 text-sm text-white/70">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>未登录</span>
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="flex items-center gap-3">
        <button class="theme-btn" aria-label="切换主题">
          <svg class="w-[18px] h-[18px] text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="menu-btn" aria-label="菜单">
          <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </nav>

    <!-- Header -->
    <header class="pt-24 md:pt-28 pb-6 md:pb-4 text-center px-4">
      <h1 class="text-[28px] md:text-[38px] font-black tracking-[0.2em] title-word mb-2">欢迎回来</h1>
      <p class="text-xs md:text-sm tracking-[0.15em] text-white/40 uppercase">开启专属恋AI之旅</p>
    </header>

    <!-- Main -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center px-5 md:px-10 pb-10 gap-6 lg:gap-10">
      <!-- Left: Character -->
      <div class="relative w-full lg:w-[48%] flex flex-col items-center justify-center">
        <div class="flex items-center gap-3 self-start mb-4 md:mb-6">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-pink-400/30 to-rose-500/20 flex items-center justify-center border border-white/10">
            <svg class="w-5 h-5 text-pink-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
          <span class="text-lg font-bold tracking-wider">和我恋爱吧</span>
        </div>
        <div class="relative">
          <div class="phone-glow" style="left: 54%; top: 62%;"></div>
          <img src="../../frontend/public/wuhao-yang-zhonggao.png" alt="趴在地上看手机的少年" class="character-img">
        </div>
        <p class="mt-4 md:mt-6 text-xs md:text-sm text-white/35 tracking-widest">每一次对话，都是一段故事的开始</p>
      </div>

      <!-- Right: Mode Cards -->
      <div class="w-full lg:flex-1 max-w-md flex flex-col gap-4 md:gap-5">
        <button class="mode-card normal w-full text-left rounded-2xl md:rounded-[22px] p-5 md:p-6">
          <div class="flex items-start gap-4 mb-4">
            <div class="icon-circle normal">
              <svg class="w-6 h-6 text-blue-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-base md:text-lg font-bold mb-0.5">普通模式</h3>
              <p class="text-xs md:text-sm text-white/45">自由探索，为真正的挑战做准备</p>
            </div>
          </div>
          <div class="flex flex-col gap-2 mb-4 pl-[64px]">
            <div class="flex items-center gap-2.5 text-xs md:text-sm text-white/55"><span class="dot normal"></span>自定义角色性格</div>
            <div class="flex items-center gap-2.5 text-xs md:text-sm text-white/55"><span class="dot normal"></span>适合新手入门</div>
          </div>
          <div class="flex items-center justify-between pl-[64px] pt-3 border-t border-white/[0.06]">
            <span class="text-xs md:text-sm font-semibold text-white/50 group-hover:text-white/80">开始体验</span>
            <svg class="arrow-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </button>

        <button class="mode-card challenge w-full text-left rounded-2xl md:rounded-[22px] p-5 md:p-6">
          <div class="flex items-start gap-4 mb-4">
            <div class="icon-circle challenge">
              <svg class="w-6 h-6 text-rose-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-base md:text-lg font-bold mb-0.5">挑战模式</h3>
              <p class="text-xs md:text-sm text-white/45">模拟真实环境</p>
            </div>
          </div>
          <div class="flex flex-col gap-2 mb-4 pl-[64px]">
            <div class="flex items-center gap-2.5 text-xs md:text-sm text-white/55"><span class="dot challenge"></span>系统随机角色人格</div>
            <div class="flex items-center gap-2.5 text-xs md:text-sm text-white/55"><span class="dot challenge"></span>分数记入排名</div>
            <div class="flex items-center gap-2.5 text-xs md:text-sm text-white/55"><span class="dot challenge"></span>适合情场高手</div>
          </div>
          <div class="flex items-center justify-between pl-[64px] pt-3 border-t border-white/[0.06]">
            <span class="text-xs md:text-sm font-semibold text-white/50">接受挑战</span>
            <svg class="arrow-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </button>

        <div class="flex items-center justify-center gap-2 text-[11px] md:text-xs text-white/25 mt-1">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"/></svg>
          <span>所有对话均由AI驱动，每次体验都独一无二</span>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { EffectComposer } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    const canvas = document.getElementById('scene-canvas');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = window.innerWidth < 768;

    // Scene setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a0f14, 0.012);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 7.8);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
    renderer.setClearColor(0x2a1a22, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.75);
    composer.addPass(bloomPass);

    // Materials
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a3a48, roughness: 0.9, metalness: 0 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d252f, roughness: 0.78, metalness: 0.12 });
    const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x1e1016, roughness: 0.55 });
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x151025,
      roughness: 0.12,
      metalness: 0.1,
      transmission: 0.25,
      transparent: true,
      opacity: 0.75,
      emissive: 0x334466,
      emissiveIntensity: 0.15
    });
    const lampShadeMat = new THREE.MeshStandardMaterial({ color: 0xffecd8, roughness: 0.55, emissive: 0xffaa66, emissiveIntensity: 0.55 });
    const lampBaseMat = new THREE.MeshStandardMaterial({ color: 0x3a222a, roughness: 0.45 });

    // Room geometry
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(18, 12), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.2;
    floor.position.z = -1;
    scene.add(floor);

    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(18, 10), wallMat);
    backWall.position.z = -6;
    backWall.position.y = 3.8;
    scene.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 10), wallMat);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.position.set(-8, 3.8, -1);
    scene.add(leftWall);

    // Window frame
    const frameGroup = new THREE.Group();
    const frameV = new THREE.Mesh(new THREE.BoxGeometry(0.12, 5.5, 0.12), windowFrameMat);
    const frameH = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.12, 0.12), windowFrameMat);
    const frameTop = frameH.clone();
    const frameBottom = frameH.clone();
    frameTop.position.y = 2.75;
    frameBottom.position.y = -2.75;
    const frameLeft = frameV.clone();
    const frameRight = frameV.clone();
    frameLeft.position.x = -1.9;
    frameRight.position.x = 1.9;
    const frameMidH = frameH.clone();
    frameMidH.scale.set(0.95, 1, 1);
    frameMidH.position.y = 0;
    const frameMidV = frameV.clone();
    frameMidV.scale.set(1, 0.95, 1);
    frameMidV.position.x = 0;
    frameGroup.add(frameTop, frameBottom, frameLeft, frameRight, frameMidH, frameMidV);
    frameGroup.position.set(3.5, 3.2, -5.92);
    scene.add(frameGroup);

    // Window glass
    const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 5.5), glassMat);
    windowGlass.position.set(3.5, 3.2, -5.9);
    scene.add(windowGlass);

    // Table
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 1.6), new THREE.MeshStandardMaterial({ color: 0x2e1d24, roughness: 0.7 }));
    tableTop.position.set(-3.5, -0.2, -1.5);
    scene.add(tableTop);

    // Lamp
    const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.12, 32), lampBaseMat);
    lampBase.position.set(-3.5, -0.08, -1.5);
    const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.9, 16), lampBaseMat);
    lampPole.position.set(-3.5, 0.4, -1.5);
    const lampShade = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.55, 32, 1, true), lampShadeMat);
    lampShade.position.set(-3.5, 0.85, -1.5);
    scene.add(lampBase, lampPole, lampShade);

    // Books stack
    const bookColors = [0x3d4f32, 0x5c4a32, 0x4a3b4a];
    for (let i = 0; i < 3; i++) {
      const book = new THREE.Mesh(
        new THREE.BoxGeometry(0.5 + Math.random() * 0.1, 0.08, 0.7 + Math.random() * 0.1),
        new THREE.MeshStandardMaterial({ color: bookColors[i], roughness: 0.8 })
      );
      book.position.set(-2.8 + i * 0.12, -0.08 + i * 0.08, -1.6 + Math.random() * 0.1);
      book.rotation.y = (Math.random() - 0.5) * 0.15;
      scene.add(book);
    }

    // Lights
    const ambientLight = new THREE.AmbientLight(0x443344, 0.85);
    scene.add(ambientLight);

    // Phone glow from character's hands area (screen-space direction)
    const phoneLight = new THREE.PointLight(0x8fb0ff, 3.2, 16);
    phoneLight.position.set(-0.2, 0.1, 2.2);
    scene.add(phoneLight);

    const lampLight = new THREE.PointLight(0xffd9a0, 2.2, 12);
    lampLight.position.set(-3.5, 0.7, -1.5);
    scene.add(lampLight);

    // Window moon/city light
    const windowLight = new THREE.RectAreaLight(0xaaccff, 2.4, 3.5, 5.2);
    windowLight.position.set(3.5, 3.2, -5.6);
    windowLight.lookAt(3.5, 3.2, 0);
    scene.add(windowLight);

    // Window moon glow sphere
    const moonGlow = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0x7799cc, transparent: true, opacity: 0.12 })
    );
    moonGlow.position.set(3.5, 3.2, -5.4);
    scene.add(moonGlow);

    // Soft fill from above
    const fillLight = new THREE.DirectionalLight(0x665566, 0.45);
    fillLight.position.set(0, 6, 4);
    scene.add(fillLight);

    // Particles - messages as light dust
    const particleCount = isMobile ? 120 : 280;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const speeds = new Float32Array(particleCount);
    const phases = new Float32Array(particleCount);
    const sizes = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 10;
      positions[i * 3 + 1] = Math.random() * 7 - 1;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 8 - 1;
      speeds[i] = 0.2 + Math.random() * 0.6;
      phases[i] = Math.random() * Math.PI * 2;
      sizes[i] = 0.015 + Math.random() * 0.035;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const particleMat = new THREE.PointsMaterial({
      color: 0xaabbff,
      size: 0.04,
      transparent: true,
      opacity: 0.55,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Mouse parallax
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    if (!prefersReducedMotion) {
      document.addEventListener('mousemove', (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 0.8;
        targetY = (e.clientY / window.innerHeight - 0.5) * 0.5;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (e.touches[0]) {
          targetX = (e.touches[0].clientX / window.innerWidth - 0.5) * 0.6;
          targetY = (e.touches[0].clientY / window.innerHeight - 0.5) * 0.4;
        }
      }, { passive: true });
    }

    // Animation loop
    let time = 0;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      time += dt;

      if (!prefersReducedMotion) {
        currentX += (targetX - currentX) * 0.04;
        currentY += (targetY - currentY) * 0.04;

        camera.position.x = currentX * 1.0;
        camera.position.y = 1.3 + currentY * 0.5;
        camera.lookAt(0, 0.5, -2);

        // Particles rise and swirl
        const pos = particles.geometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          pos[i * 3 + 1] += speeds[i] * dt * 0.4;
          pos[i * 3] += Math.sin(time * 0.5 + phases[i]) * dt * 0.05;
          if (pos[i * 3 + 1] > 7) {
            pos[i * 3 + 1] = -1;
            pos[i * 3] = (Math.random() - 0.5) * 8;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 6 - 1;
          }
        }
        particles.geometry.attributes.position.needsUpdate = true;

        // Phone light pulse
        phoneLight.intensity = 1.6 + Math.sin(time * 1.2) * 0.3;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }, { passive: true });
  </script>
</body>
</html>
