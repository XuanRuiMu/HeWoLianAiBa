name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:

          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  QianDuan:
    name: QianDuan CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QianDuan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
          cache: 'npm'
          cache-dependency-path: 'QianDuan/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  HouDuan:
    name: HouDuan CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HouDuan
    env:

      DATABASE_URL: postgresql://lianaiba:${{ secrets.CI_TEST_POSTGRES_PASSWORD || 'lianaiba_dev' }}@localhost:5432/lianaiba_test
      TEST_DATABASE_URL: postgresql://lianaiba:${{ secrets.CI_TEST_POSTGRES_PASSWORD || 'lianaiba_dev' }}@localhost:5432/lianaiba_test
      REDIS_PASSWORD: ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_URL: redis://:ci-redis-${{ github.run_id }}-${{ github.run_attempt }}@localhost:6379
      NODE_ENV: test

      JWT_SECRET: ${{ secrets.CI_TEST_JWT_SECRET || 'ci-test-jwt-secret-ci-test-jwt-secret-32' }}

      DEEPSEEK_API_KEY: ci-placeholder-key-model-name-self-check
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: lianaiba_test
          POSTGRES_USER: lianaiba

          POSTGRES_PASSWORD: ${{ secrets.CI_TEST_POSTGRES_PASSWORD || 'lianaiba_dev' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lianaiba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.2-alpine3.23@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout sibling repo 恋爱吧管理中心（跨仓同源守卫读对端真源）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: XuanRuiMu/LianAiBaGuanLiZhongXin
          ref: main
          path: 恋爱吧管理中心
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
          cache: 'npm'
          cache-dependency-path: 'HouDuan/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)

        run: npm audit --omit=dev --audit-level=high

      - name: Enable Redis authentication
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"

      - name: Typecheck (主配置)
        run: npm run typecheck

      - name: Typecheck (度量链)
        run: npm run typecheck:度量

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare isolated ShuJuKu
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../ShuJuKu/000_baseline.sql
          ./node_modules/.bin/ts-node scripts/run_migration.ts
          ./node_modules/.bin/ts-node scripts/run_migration.ts

      - name: Verify ShuJuKu migrations
        run: |

          psql "$DATABASE_URL" -f ../ShuJuKu/000_baseline.sql

          ./node_modules/.bin/ts-node scripts/run_migration.ts

          psql "$DATABASE_URL" -c "SELECT version, checksum FROM schema_migrations ORDER BY version;"

          ./node_modules/.bin/ts-node scripts/run_migration.ts

      - name: Test
        run: npm run test

  simulate-clearance:
    name: Simulate Clearance Rounds (A-3)
    runs-on: ubuntu-latest
    needs: HouDuan
    defaults:
      run:
        working-directory: HouDuan
    env:

      DATABASE_URL: postgresql://lianaiba:${{ secrets.CI_TEST_POSTGRES_PASSWORD || 'lianaiba_dev' }}@localhost:5432/lianaiba_test
      TEST_DATABASE_URL: postgresql://lianaiba:${{ secrets.CI_TEST_POSTGRES_PASSWORD || 'lianaiba_dev' }}@localhost:5432/lianaiba_test
      REDIS_PASSWORD: ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_URL: redis://:ci-redis-${{ github.run_id }}-${{ github.run_attempt }}@localhost:6379
      NODE_ENV: test

      JWT_SECRET: ${{ secrets.CI_TEST_JWT_SECRET || 'ci-test-jwt-secret-ci-test-jwt-secret-32' }}
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: lianaiba_test
          POSTGRES_USER: lianaiba

          POSTGRES_PASSWORD: ${{ secrets.CI_TEST_POSTGRES_PASSWORD || 'lianaiba_dev' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lianaiba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.2-alpine3.23@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
          cache: 'npm'
          cache-dependency-path: 'HouDuan/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)

        run: npm audit --omit=dev --audit-level=high

      - name: Enable Redis authentication
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"

      - name: Initialize ShuJuKu schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../ShuJuKu/000_baseline.sql
          ./node_modules/.bin/ts-node scripts/run_migration.ts
          ./node_modules/.bin/ts-node scripts/run_migration.ts

      - name: Run A-3 通关轮次E2E模拟
        run: ./node_modules/.bin/ts-node scripts/模拟通关轮次.ts
        timeout-minutes: 15
