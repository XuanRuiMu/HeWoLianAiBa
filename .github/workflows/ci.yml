name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 全量历史扫描：历史提交中泄露过的密钥同样会被检出
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --coverage

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://lovewithme:lovewithme_dev@localhost:5432/lovewithme_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-ci-test-jwt-secret-32
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lovewithme_test
          POSTGRES_USER: lovewithme
          POSTGRES_PASSWORD: lovewithme_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovewithme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --coverage

      - name: Verify database migrations
        run: |
          # 1. Apply baseline schema (simulates docker-entrypoint-initdb.d)
          psql "$DATABASE_URL" -f ../database/000_baseline.sql
          # 2. Run incremental migrations
          npx ts-node scripts/run_migration.ts
          # 3. Verify schema_migrations table has all expected versions
          psql "$DATABASE_URL" -c "SELECT version, checksum FROM schema_migrations ORDER BY version;"
          # 4. Verify idempotency: run again, should skip all
          npx ts-node scripts/run_migration.ts

  simulate-clearance:
    name: Simulate Clearance Rounds (A-3)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://lovewithme:lovewithme_dev@localhost:5432/lovewithme_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lovewithme_test
          POSTGRES_USER: lovewithme
          POSTGRES_PASSWORD: lovewithme_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovewithme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

      - name: Initialize database schema
        run: |
          psql "$DATABASE_URL" -f ../database/000_baseline.sql
          npx ts-node scripts/run_migration.ts

      - name: Run A-3 通关轮次E2E模拟
        run: npx ts-node scripts/模拟通关轮次.ts
        timeout-minutes: 15
