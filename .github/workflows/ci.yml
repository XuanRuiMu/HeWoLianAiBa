name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全量历史扫描：历史提交中泄露过的密钥同样会被检出
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --coverage

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://lovewithme:lovewithme_dev@localhost:5432/lovewithme_test
      TEST_DATABASE_URL: postgresql://lovewithme:lovewithme_dev@localhost:5432/lovewithme_test
      REDIS_PASSWORD: ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_URL: redis://:ci-redis-${{ github.run_id }}-${{ github.run_attempt }}@localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-ci-test-jwt-secret-32
      # FP-14 模型名自检用例需要「已配置密钥」这一前置条件才能走到比对分支
      # （DeepSeek客户端.ts 的 ziJianMoXingMingKeYong：`if (!miYao || !jiChu) return true`）。
      # CI 不入库 .env，故显式给一个占位值；该用例已 mock fetch，不会真的发出请求。
      DEEPSEEK_API_KEY: ci-placeholder-key-model-name-self-check
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: lovewithme_test
          POSTGRES_USER: lovewithme
          POSTGRES_PASSWORD: lovewithme_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovewithme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout sibling repo 恋爱吧管理中心（跨仓同源守卫读对端真源）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: XuanRuiMu/LianAiBaGuanLiZhongXin
          ref: main
          path: 恋爱吧管理中心
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

      - name: Enable Redis authentication
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare isolated database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/000_baseline.sql
          ./node_modules/.bin/ts-node scripts/run_migration.ts
          ./node_modules/.bin/ts-node scripts/run_migration.ts

      - name: Test
        run: npm run test -- --coverage

      - name: Verify database migrations
        run: |
          # 1. Apply baseline schema (simulates docker-entrypoint-initdb.d)
          psql "$DATABASE_URL" -f ../database/000_baseline.sql
          # 2. Run incremental migrations
          ./node_modules/.bin/ts-node scripts/run_migration.ts
          # 3. Verify schema_migrations table has all expected versions
          psql "$DATABASE_URL" -c "SELECT version, checksum FROM schema_migrations ORDER BY version;"
          # 4. Verify idempotency: run again, should skip all
          ./node_modules/.bin/ts-node scripts/run_migration.ts

  simulate-clearance:
    name: Simulate Clearance Rounds (A-3)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://lovewithme:lovewithme_dev@localhost:5432/lovewithme_test
      TEST_DATABASE_URL: postgresql://lovewithme:lovewithme_dev@localhost:5432/lovewithme_test
      REDIS_PASSWORD: ci-redis-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_URL: redis://:ci-redis-${{ github.run_id }}-${{ github.run_attempt }}@localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-ci-test-jwt-secret-32
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: lovewithme_test
          POSTGRES_USER: lovewithme
          POSTGRES_PASSWORD: lovewithme_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lovewithme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high

      - name: Enable Redis authentication
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"

      - name: Initialize database schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database/000_baseline.sql
          ./node_modules/.bin/ts-node scripts/run_migration.ts
          ./node_modules/.bin/ts-node scripts/run_migration.ts

      - name: Run A-3 通关轮次E2E模拟
        run: ./node_modules/.bin/ts-node scripts/模拟通关轮次.ts
        timeout-minutes: 15
