            const blockedHosts = ['ingest.analytics.invantis.tech'];
            function shouldBlock(url) {

    <script>

        // 点击后 bundle 会给 .loading 加 .loaded（已被 CSS 隐藏）；并加硬兜底强制进入。
        (function () {
            var clicked = false;

                var l = document.querySelector('.loading');
                if (l) l.style.display = 'none';
            }
            function tryStart() {
                if (clicked) return;
                var btn = document.querySelector('.loading button');
                var circle = document.querySelector('.loading .circle-container');
                if (!circle) { setTimeout(tryStart, 200); return; }
                // 引擎就绪（window.__dcm 存在）或 Start 按钮带 .show 时即可揭示，不再死等按钮
                var ready = (btn && btn.classList.contains('show')) || window.__dcm;
                if (!ready) { setTimeout(tryStart, 200); return; }
                clicked = true;
                try { circle.click(); } catch (e) {}

                setTimeout(function () {
                    var l = document.querySelector('.loading');
                    if (l && getComputedStyle(l).display !== 'none') hideLoading();

            }
            window.addEventListener('load', function () { setTimeout(tryStart, 400); });

            setTimeout(function () {
                if (clicked) return;

                hideLoading();
            }, 12000);

    <script>
        /* 主题联动（深色=夜晚 / 浅色=白天）+ 草色 + 地形色：

                    if (u.uDarkGreen && u.uDarkGreen.value) u.uDarkGreen.value.set(palette[1]);

           - revealMesh.startReveal() 让卷须/描边辉光（uRevealProgress）0→1 淡出；
           - postProcessing.startReveal() 让 line-glow 水体揭示（uProgress）0→1 淡出；
           两者淡出后即露出底层真实金色草地。开场滤镜为紫色（bundle 中 lineGlowColor/glowColor=#b07be0），
           随 reveal 渐隐，并非改色。引擎就绪(__dcm)且 reveal 方法可用后再延时触发，硬兜底 15s。 */
        (function () {
            var done = false, scheduled = false;
            function ready() {
                var e = window.__experience;
                return !!(e && e.revealMesh && e.revealMesh.startReveal &&
                          e.postProcessing && e.postProcessing.startReveal);
            }
            function fire() {
                if (done || !ready()) return;
                try {
                    window.__experience.revealMesh.startReveal();
                    window.__experience.postProcessing.startReveal();
                } catch (e) { scheduled = false; return; }
                done = true;
            }
            function loop() {
                if (done || scheduled) return;
                if (window.__dcm && ready()) { scheduled = true; setTimeout(fire, 2000); }
                else setTimeout(loop, 300);
            }
            loop();
            setTimeout(function () { if (!done) fire(); }, 15000);
        })();
    </script>
        <script>
        /* 吴昊阳×草地融合系统 v8 —— 分关节可动画3D角色（articulated 3D puppet）
           
           根因修复（对比v7）：
           v7用腾讯混元image-to-3D生成直立人形GLB（Y高1.175/X宽0.405），旋转+90°趴下后
           UV映射与趴姿不对应→背心字幕(#3 YOUNG)/脸/手臂全部错位。探针脚本(rx90/rx-90/
           rx180)是症状修补——单张照片AI生3D无法产出可控姿势的rigged模型。
           
           本版根因修复：构建分关节可动画3D角色——从源照片(1537×1023 RGBA)裁剪各身体部位为
           独立3D平面纹理，组成带层级变换的人体骨架。每个部位是独立Mesh，可绕关节轴点旋转
           （抬腿/挥手等动画），同时外观精确匹配源照片（纹理即照片本身）。
           MeshBasicMaterial + 烘焙体积光影解决引擎无光照材质约束。
           
           架构：root Group → 6个身体部位Group（含pivot轴点）→ 每组内PlaneGeometry+CanvasTexture
           动画接口：window.__wuHaoYangAnim = { 抬左腿(angle), 抬右腿(angle), 挥左臂(angle), ... } */
/* ===== 吴昊阳 · 真实 3D 模型（GLB） =====
   腾讯混元图生3D生成的真实体积网格（models/wuhaoyang.glb）
   替代原 v5 平面贴图方案。模型自带 PBR 材质和趴姿。
   架构：GLTFLoader 加载 .glb → Scene.add(model) → renderOrder 保证在草叶之上 */
(function () {
    var MODEL_URL = '../models/wuhaoyang.glb';
    var PEI_ZHI = {
        weiZhi:     { x: 2.103, y: 0.02, z: 0.744 },
        chiCun:     0.25,
        yeJianYanSe:'#cdbff0',
        jiaoYingTouMingDu: 0.22,
        shiChaBeiShu: 3,
        huXiFuDu:   0.018,
    };

    var genGen = null;
    var yiJianZao = false;
    var jiZhun = { x: 0, y: 0 };

    function jiaZaiMoXing(T, sc) {
        if (!T || !T.GLTFLoader) {
            console.warn('[WuHaoYang] GLTFLoader 不可用，等待...');
            return false;
        }

        var loader = new T.GLTFLoader();
        loader.load(MODEL_URL, function (gltf) {
            var model = gltf.scene;
            model.name = 'WuHaoYangRoot';

            // 位置与缩放
            model.position.set(PEI_ZHI.weiZhi.x, PEI_ZHI.weiZhi.y, PEI_ZHI.weiZhi.z);
            model.scale.set(PEI_ZHI.chiCun, PEI_ZHI.chiCun, PEI_ZHI.chiCun);

            // 遍历所有 mesh：设置高 renderOrder + depthTest:false 确保在草叶之上渲染
            model.traverse(function (child) {
                if (child.isMesh) {
                    child.renderOrder = 999;
                    if (child.material) {
                        child.material.depthTest = false;
                        child.material.depthWrite = false;
                    }
                }
            });

            sc.add(model);
            genGen = model;
            yiJianZao = true;
            jiZhun.y = model.position.y;

            console.log('[WuHaoYang] 真实 3D 模型加载成功');
        }, undefined, function (err) {
            console.error('[WuHaoYang] GLB 加载失败:', err);
        });
        return true;
    }

    function chuFa() {
        try {
            var T = window.__THREE;
            var XP = window.__experience;
            var sc = XP && XP.engine ? XP.engine.scene : null;
            if (!T || !sc) {
                // bundle 尚未初始化完成，稍后重试
                setTimeout(chuFa, 200);
                return;
            }
            if (!T.GLTFLoader) {
                // GLTFLoader 可能还没加载完，稍后重试
                setTimeout(chuFa, 200);
                return;
            }
            jiaZaiMoXing(T, sc);
        } catch (e) {
            console.error('[WuHaoYang]', e);
        }
    }

    // 多重触发保障
    if (window.__experience && window.__experience && window.__experience.engine) {
        chuFa();
    } else {
        document.addEventListener('__experience_ready', chuFa);
        setTimeout(chuFa, 5000);
    }
})();
    </script>
