            background: #0a0a12;

        body.simplified nav,
        body.simplified .viewpoints-progress,
        body.simplified .sound-icon,
        body.simplified #home .look-around-hint,
        body.simplified #home .explore-hint,
        body.simplified #about,

        body.simplified #point-template,

            display: none !important;
        }
        /* 默认即隐藏所有非 canvas 元素（不依赖 .simplified 类） */
        nav, .viewpoints-progress, .sound-icon,
        #home .look-around-hint, #home .explore-hint,
        #about, #contact, .update, #point-template, #dayNightSwitch {
            display: none !important;

        /* bundle 点击 Start 后给 .loading 加 .loaded / .hidden，隐藏它以免遮挡 canvas */
        .loading.loaded, .loading.hidden { display: none !important; }
        /* 静默加载：隐藏圆形进度动画与百分比文字，仅保留不透明遮罩覆盖画布，
           避免加载期间透出夜景/紫色的瞬时帧（背景应无声无息地备好）。 */
        .progress-percentage, .loading-text { visibility: hidden !important; opacity: 0 !important; }
        /* loading 保持原生可见与可点击；bundle 进入后会自行隐藏它。背景页在 iframe 中，
           真实项目主页的 UI 会覆盖其上，因此 Loading 闪光只会在页面加载最初 1-2s 透出。 */
        /* canvas 铺满 */
        canvas.webgl {
            position: fixed;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

            // FP-03：阴影片与人物 mesh 同生命周期——任一被移除即整体降级，清理残留阴影片后随人物重建
            //（未建阴影片（关闭/未创建）时 yinRengZai 恒真，不参与判定）。
            if (zhenShu % 60 === 0 && exp && exp.engine && exp.engine.scene) {
                var rengZai = false, yinRengZai = !yinYingMesh;
                try {
                    exp.engine.scene.traverse(function (o) { if (o === mesh) rengZai = true; else if (o === yinYingMesh) yinRengZai = true; });
                } catch (e) {}
                if (window.__wuZhuJueZhuGuan && (!rengZai || !yinRengZai)) {
                    if (yinYingMesh) { try { exp.engine.scene.remove(yinYingMesh); } catch (e) {} }
                    yinYingMesh = null;
                    window.__wuZhuJueZhuGuan = false;
                    window.__wuDaoLu = null;
                    window.__wuZhuJueMesh = null; // 已移除的引用不让门控 S4/S5 误判就绪
                    mesh = null;
                    yiJiuXu = false;
                    __wuDLog('[T3] 平面已丢失，主道路降级，触发重建');
                    setTimeout(dengJiChu, 800);
                    return;
                }
                /* FP-06 R1：健康监测同频复测草根高度。铰链语义下 mesh.position 即铰链点
                   （贴图底边中点，脚侧贴地），地形起伏只沿世界 y 平移，故直接改 position.y
                   即为正确贴地；铰链几何与固定朝向随建随设，不需重跑任何定位求解。
                   GANG_TI 呼吸浮动在此唯一 y 写入点叠加（自算相位，与 2359 行 huXiZhen
                   同源同频，时间差 <1ms 相位不可辨），避免独立写入被本处覆盖。 */
                if (gongYong && gongYong.ceLiangCaoGenGaoDu) {
                    var ceXin = gongYong.ceLiangCaoGenGaoDu(PEI_ZHI.weiZhi.x, PEI_ZHI.weiZhi.z);
                    if (ceXin != null && isFinite(ceXin)) {
                        dangQianGaoDu = ceXin;
                        var chenRu2 = (PEI_ZHI.chiCun * CAN_SHU.chiCunBeiShu) * WEI_CHEN.biLi;
                        if (mesh) mesh.position.y = ceXin - chenRu2 + (GANG_TI.qiYong ? Math.sin((Date.now() - gongYong.t0) / 1000 * 0.9) * GANG_TI.fuDu : 0);
                        if (yinYingMesh) yinYingMesh.position.y = ceXin + YIN_YING.eP;
                    }
                }
            }
            // 草压弯注入检查（低频节流，与每帧强度驱动解耦：未完成时每帧重试，
            // 完成后每 120 帧/缓存过期补查新材质）
            var nowMs = Date.now();
            if (zhenShu % 120 === 0 || !yaWanWanCheng || nowMs - yaWanCacheTime > 30000) {
                if (gongYong) yaWanWanCheng = gongYong.zhuRuYaWan();
                yaWanCacheTime = nowMs;
            }
            // 不透明度直算（每帧）：reveal uniform 优先；本 bundle 实测无 uRevealProgress，
            // 故揭示时刻起的时间通道是常轨（600ms 延迟 + 7.5s 平滑淡入，与背景中心扩散同步，
            // 两者取大）；__wuTouMingDu 导出供调试面板
            var u = gongYong ? (gongYong.quRevealUniform() || (gongYong.zhaoReveal() ? gongYong.quRevealUniform() : null)) : null;
            /* FP-08：门控通过后刷新揭示进度下限；uniform 已挂钩 getter= max(engine,floor)。
               再补写一次引擎引用，防 getter 尚未挂上时的首帧空窗。 */
            if (window.__caoDiYiJieLu) {
                if (!jieLuShiKe) jieLuShiKe = Date.now();
                if (gongYong && gongYong.gengXinJieLuDiXian) gongYong.gengXinJieLuDiXian();
                /* FP-09：每帧锁定构图机位（扩权后对齐效果图），压过引擎 lookAround/指针视差 */
                try {
                    if (XIANG_JI_GOU_TU && XIANG_JI_GOU_TU.qiYong) {
                        var expCam = window.__experience;
                        var camWrap = expCam && expCam.engine && expCam.engine.camera;
                        var camInst = camWrap && (camWrap.instance || (camWrap.group && camWrap.group.children && camWrap.group.children[0]));
                        if (camInst && camInst.position) {
                            camInst.position.set(XIANG_JI_GOU_TU.weiZhi.x, XIANG_JI_GOU_TU.weiZhi.y, XIANG_JI_GOU_TU.weiZhi.z);
                            if (camInst.fov !== XIANG_JI_GOU_TU.fov) {
                                camInst.fov = XIANG_JI_GOU_TU.fov;
                                if (camInst.updateProjectionMatrix) camInst.updateProjectionMatrix();
                            }
                            if (camInst.lookAt) {
                                camInst.lookAt(XIANG_JI_GOU_TU.muBiao.x, XIANG_JI_GOU_TU.muBiao.y, XIANG_JI_GOU_TU.muBiao.z);
                            }
                            camInst.updateMatrixWorld(true);
                            window.__wuXiangJi = { fov: camInst.fov, pos: camInst.position.toArray(), muBiao: XIANG_JI_GOU_TU.muBiao };
                        }
                    }
                } catch (xiangJiErr) {}
                try {
                    var expJieLu = window.__experience;
                    var uJieLu = expJieLu && expJieLu.revealMesh && expJieLu.revealMesh.material &&
                        expJieLu.revealMesh.material.uniforms && expJieLu.revealMesh.material.uniforms.uRevealProgress;
                    if (uJieLu && gongYong && gongYong.gouJianJieLuDiXian) gongYong.gouJianJieLuDiXian(uJieLu);
                    if (u && gongYong && gongYong.gouJianJieLuDiXian) gongYong.gouJianJieLuDiXian(u);
                } catch (jieLuErr) {}
                u = gongYong ? (gongYong.quRevealUniform() || (gongYong.zhaoReveal() ? gongYong.quRevealUniform() : null)) : u;
            }
            var p = u ? Math.min(1, Math.max(0, (u.value - 0.02) / 0.30)) : 0;
            var bu = p * p * (3 - 2 * p);
            if (window.__caoDiYiJieLu) {
                var qt = Math.min(1, Math.max(0, (Date.now() - jieLuShiKe - 600) / 7500));
                var timeBu = qt * qt * (3 - 2 * qt);
                if (timeBu > bu) bu = timeBu;
            }
            window.__wuTouMingDu = bu;
            mesh.material.opacity = bu;
            var huXiZhen = gongYong ? Math.sin((nowMs - gongYong.t0) / 1000 * 0.9) : 0;
            /* FP-12：阴影片每帧跟 billboard 姿态（地面落位随镜头俯仰/偏航变化），
               随后呼吸微动在最新基准上摆动 */
            gengXinYinYing();
            /* 阴影片呼吸微动（FP-03）：随压伏呼吸 sin 同相位 1-2% 尺寸/不透明度微调（活物感），
               不透明度上限 YIN_YING.shangXian；随 reveal 淡入（与人物同显现节奏） */
            if (yinYingMesh) {
                var yinOpacity = YIN_YING.touMingDu * bu * (1 + huXiZhen * 0.02);
                yinYingMesh.material.opacity = Math.min(YIN_YING.shangXian, Math.max(0, yinOpacity));
                var weiDong = 1 + huXiZhen * 0.012;
                yinYingMesh.scale.set(yinJiChuX * weiDong, yinJiChuY * weiDong, 1);
            }
            /* GANG_TI 刚体立体化每帧（像素永不形变，仅 mesh transform 级）：
               呼吸缩放脉动与阴影片同相位（活物感统一）+ 微摇曳（约半频错相，
               避免与浮动同步显机械）；绕铰链 rotation.z，底边贴地固定头摆动。
               scale 基准随 mesh 重建自动重取；摇曳 0 为 gongYong 缺省时的静止态 */
            if (GANG_TI.qiYong && mesh) {
                if (GANG_TI._mesh !== mesh || !isFinite(GANG_TI._jiZhunSuoFang)) {
                    GANG_TI._mesh = mesh;
                    GANG_TI._jiZhunSuoFang = mesh.scale.x;
                }
                var gangSuo = GANG_TI._jiZhunSuoFang * (1 + huXiZhen * GANG_TI.suoFang);
                mesh.scale.set(gangSuo, gangSuo, gangSuo);
                var gangYaoXiang = gongYong ? Math.sin((nowMs - gongYong.t0) / 1000 * 0.48) : 0;
                mesh.rotation.z = gangYaoXiang * GANG_TI.yaoYe;
            }
            /* 草压弯强度驱动（每帧）：基准强度 + 鼠标扫过增强 + 0.08 平滑 + 呼吸 sin；
               调参钩子 __yaWanTiao（整体覆盖）/ __yaWanShouLian（立即收敛）由共享基础设施承载。
               鼠标增强的屏幕投影是 cam 在本循环的唯一消费者（billboard 已删），
               读取与投影均局部化于此，cam/向量不可用时跳过增强不跳过基准驱动。 */
            if (gongYong && yaWanWanCheng && gongYong.yaWanCaiZhi.length) {
                var tiao = window.__yaWanTiao || {};
                var jiZhunQiangDu = tiao.strength != null ? tiao.strength : gongYong.YA_WAN.strength;
                var huXiFuDu = tiao.huxi != null ? tiao.huxi : gongYong.YA_WAN.huxi;
                var muBiao = jiZhunQiangDu;
                var cam = exp && exp.engine && exp.engine.camera && exp.engine.camera.instance;
                if (cam) {
                    if (!linShiXiangLiang) {
                        var fuZhen = window.__fuZhenSanWei ? window.__fuZhenSanWei.qu() : null;
                        var PW = fuZhen && fuZhen.THREE;
                        if (PW && PW.Vector3) linShiXiangLiang = new PW.Vector3();
                    }
                    if (linShiXiangLiang) {
                        linShiXiangLiang.setFromMatrixPosition(mesh.matrixWorld);
                        linShiXiangLiang.project(cam);
                        var jiaoX = (linShiXiangLiang.x + 1) / 2 * window.innerWidth;
                        var jiaoY = (1 - linShiXiangLiang.y) / 2 * window.innerHeight;
                        if (Math.abs(gongYong.guBiao.x - jiaoX) < 260 && Math.abs(gongYong.guBiao.y - jiaoY) < 230) {
                            muBiao = jiZhunQiangDu * (tiao.shuBiaoJia != null ? tiao.shuBiaoJia : gongYong.YA_WAN.shuBiaoJia);
                        }
                    }
                }
                gongYong.qiangDu += (muBiao - gongYong.qiangDu) * 0.08;
                var zuiZhong = gongYong.qiangDu + Math.sin((nowMs - gongYong.t0) / 1000 * 0.9) * huXiFuDu;
                // FP-03：轮廓场参数每帧同步——CAN_SHU 当前值（θ/yaw/尺寸）随 URL 调参实时生效；
                // mask 纹理后到（草材质先注入）时在此即时接入，双时序都不崩
                var maskKeLongCur = gongYong.quMaskWenLi();
                var zuKuanXi = tiao.zuKuanXi != null ? tiao.zuKuanXi : gongYong.YA_WAN.zuKuanXi;
                var zuChangXi = tiao.zuChangXi != null ? tiao.zuChangXi : gongYong.YA_WAN.zuChangXi;
                var touYingKuan = PEI_ZHI.chiCun * CAN_SHU.chiCunBeiShu * zuKuanXi;
                /* FP-R1 根因：场长=全身足迹尺度（与卡高同量级），不再乘 sin(后仰角)。
                   图像是俯卧人体，观众读到的接触面是全身；旧 sin 压缩使场长只剩卡高 ~35%
                   且挤在铰链旁，压塌/倒伏几乎全落在角色平面遮挡后方 ⇒ 用户看不见。 */
                var touYingChang = PEI_ZHI.chiCun * CAN_SHU.chiCunBeiShu * zuChangXi;
                for (var i = 0; i < gongYong.yaWanCaiZhi.length; i++) {
                    var caiZhi = gongYong.yaWanCaiZhi[i].uniforms;
                    /* FP-13 ④：压伏随草地揭示进度淡入（草是"逐渐被趴下去"的，不是一上来就平）；
                       bu=reveal 进度 0→1，与人物/阴影片同一节奏。 */
                    caiZhi.uCharStrength.value = zuiZhong * bu;
                    if (tiao.r0 != null) caiZhi.uCharR0.value = tiao.r0;
                    if (tiao.r1 != null) caiZhi.uCharR1.value = tiao.r1;
                    caiZhi.uCharMask.value = maskKeLongCur;
                    caiZhi.uCharMaskOn.value = maskKeLongCur ? 1 : 0;
                    caiZhi.uCharYaw.value = mesh.rotation.y; // FP-12：billboard 实时偏航（投影轴=后仰侧）
                    caiZhi.uCharKuan.value = touYingKuan;
                    caiZhi.uCharChang.value = touYingChang;
                    // FP-06：轮廓内强度 / 梯度采样步长走统一配置（URL/调参钩子可覆盖）
                    caiZhi.uCharNeiQiangDu.value = tiao.neiQiangDu != null ? tiao.neiQiangDu : gongYong.YA_WAN.neiQiangDu;
                    caiZhi.uCharWenLiBu.value = tiao.wenLiBu != null ? tiao.wenLiBu : gongYong.YA_WAN.wenLiBu;
                    // FP-13：风抑制系数与前景草带参数（调参钩子可覆盖）
                    caiZhi.uCharFengYiZhi.value = tiao.fengYiZhi != null ? tiao.fengYiZhi : gongYong.YA_WAN.fengYiZhi;
                    caiZhi.uCharQianJingChang.value = tiao.qianJingChang != null ? tiao.qianJingChang : gongYong.YA_WAN.qianJingChang;
                    caiZhi.uCharQianJingQiang.value = tiao.qianJingQiang != null ? tiao.qianJingQiang : gongYong.YA_WAN.qianJingQiang;
                    // FP-14：体重压塌比 / 边缘倒伏增高 / 倒伏带自然起伏（调参钩子可覆盖）
                    if (caiZhi.uCharYaSui) caiZhi.uCharYaSui.value = tiao.yaSui != null ? tiao.yaSui : gongYong.YA_WAN.yaSui;
                    if (caiZhi.uCharChuanTou) caiZhi.uCharChuanTou.value = tiao.chuanTou != null ? tiao.chuanTou : gongYong.YA_WAN.chuanTou;
                    if (caiZhi.uCharZaSheng) caiZhi.uCharZaSheng.value = tiao.zaSheng != null ? tiao.zaSheng : gongYong.YA_WAN.zaSheng;
                    // FP-R1：轮廓外压塌环 / 身前稀疏高草微搭（调参钩子可覆盖）
                    if (caiZhi.uCharWaiHuan) caiZhi.uCharWaiHuan.value = tiao.waiHuan != null ? tiao.waiHuan : gongYong.YA_WAN.waiHuan;
                    if (caiZhi.uCharWaiSui) caiZhi.uCharWaiSui.value = tiao.waiSui != null ? tiao.waiSui : gongYong.YA_WAN.waiSui;
                    if (caiZhi.uCharWaiFan) caiZhi.uCharWaiFan.value = tiao.waiFan != null ? tiao.waiFan : gongYong.YA_WAN.waiFan;
                    if (caiZhi.uCharQianGao) caiZhi.uCharQianGao.value = tiao.qianGao != null ? tiao.qianGao : gongYong.YA_WAN.qianGao;
                    if (caiZhi.uCharQianQing) caiZhi.uCharQianQing.value = tiao.qianQing != null ? tiao.qianQing : gongYong.YA_WAN.qianQing;
                    if (caiZhi.uCharQianXi) caiZhi.uCharQianXi.value = tiao.qianXi != null ? tiao.qianXi : gongYong.YA_WAN.qianXi;
                    // FP-10/FP-13：草地接触 AO 强度同步（随 reveal 淡入，URL/调参钩子可覆盖）
                    if (caiZhi.uWuCaoAODu) caiZhi.uWuCaoAODu.value = (tiao.aoDu != null ? tiao.aoDu : CAO_AO_QIANG_DU) * bu;
                }
            }
        })();
    })();
