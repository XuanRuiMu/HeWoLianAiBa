<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吴昊阳 · 3D测试页</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
  #ui { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.9; max-width: 290px; }
  #ui button { background: #6c5ce7; color: #fff; border: none; padding: 5px 9px; margin: 3px 4px 0 0; border-radius: 6px; cursor: pointer; font-size: 12px; }
  #ui button:hover { background: #8577e8; }
  #ui button.active { background: #00b894; }
  #ui .sep { border-top: 1px solid #555; margin: 8px 0 4px; }
  #ui .hint { color: #9ad; font-size: 11px; line-height: 1.5; margin-top: 4px; }
  #info { position: fixed; bottom: 12px; left: 12px; z-index: 10; color: #aaa; font-size: 11px; }
  #cam-info { position: fixed; top: 12px; right: 12px; z-index: 10; color: #0f0; background: rgba(0,0,0,0.7); padding: 10px 14px; border-radius: 8px; font-family: 'Consolas','Courier New',monospace; font-size: 11px; line-height: 1.6; min-width: 260px; }
  #cam-info .label { color: #8be9fd; }
  #cam-info button { background: #50fa7b; color: #000; border: none; padding: 3px 10px; margin-top: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
</style>
</head>
<body>
<div id="ui">
  <div><b>模型</b></div>
  <button id="m-v3" class="active" onclick="loadModel('./models/wuhaoyang.glb','m-v3')">吴昊阳（v3 底模）</button>
  <button id="m-v8" onclick="loadModel('./models/wuhaoyang_v8.glb','m-v8')">吴昊阳（v8 烘焙版）</button>
  <div class="sep"><b>视角</b></div>
  <button onclick="setView('ref')">匹配参考图</button>
  <button onclick="setView('v5')">对齐视角（烘焙相机）</button>
  <button onclick="setView('auto')">自动取景</button>
  <button onclick="setView('top')">俯视</button>
  <button onclick="setView('persp')">3/4</button>
  <button onclick="setView('side')">侧视</button>
  <div class="sep"><b>渲染模式</b></div>
  <button id="btn-flat" onclick="toggleFlat()">平光（对比目标图）</button>
  <button id="btn-pure" class="active" onclick="setMode('pure')">纯3D（仅网格）</button>
  <button id="btn-proj" onclick="setMode('proj')">投影贴图（真实表面）</button>
  <button id="btn-card" onclick="setMode('card')">叠加卡片（校准用）</button>
  <div id="card-ctrl" style="display:none">
    <div><b>卡片操作（拖拽 gizmo）</b></div>
    <button id="t-trans" class="active" onclick="setTC('translate')">移动</button>
    <button id="t-rot" onclick="setTC('rotate')">旋转</button>
    <button id="t-scale" onclick="setTC('scale')">缩放</button>
    <button onclick="flipY()">上下翻转</button>
    <button onclick="mirrorX()">左右镜像</button>
    <div class="hint">拖拽卡片贴合背部，点「复制全部参数」发我。</div>
    <div class="sep"></div>
    <button onclick="copyAll()">复制全部参数</button>
  </div>
  <div id="proj-ctrl" style="display:none">
    <div><b>投影贴图微调（兜底）</b></div>
    <button id="p-flipx" onclick="toggleFlipX()">水平翻转投影</button>
    <button id="p-flipy" class="active" onclick="toggleFlipY()">垂直翻转投影</button>
    <div class="sep"></div>
    <div><b>投影相机对齐网格</b></div>
    <div style="font-size:11px">前后<input id="pz" type="range" min="-0.6" max="0.6" step="0.01" value="0" style="width:120px" oninput="updateProjCam()"></div>
    <div style="font-size:11px">上下<input id="py" type="range" min="-0.6" max="0.6" step="0.01" value="0" style="width:120px" oninput="updateProjCam()"></div>
    <div style="font-size:11px">左右<input id="px" type="range" min="-0.6" max="0.6" step="0.01" value="0" style="width:120px" oninput="updateProjCam()"></div>
    <div style="font-size:11px">缩放<input id="ps" type="range" min="0.8" max="1.25" step="0.005" value="1" style="width:120px" oninput="updateProjCam()"></div>
    <div class="hint">拖动滑块把源图花纹精确压到网格背面；调好后点「复制投影参数」发我。</div>
    <button onclick="copyProjParams()">复制投影参数</button>
  </div>
</div>
<div id="info">模型加载中...</div>
<div id="cam-info">
  <div><span class="label">camera.position</span></div>
  <div id="cam-pos">--</div>
  <div style="margin-top:6px"><span class="label">controls.target</span></div>
  <div id="cam-tgt">--</div>
  <button onclick="copyCamParams()">复制相机参数</button>
</div>

<script src="./three-r128.min.js"></script>
<script src="./OrbitControls-r128.js"></script>
<script src="./GLTFLoader-r128.js"></script>
<script src="./TransformControls-r128.js"></script>
<script>
/* ===== 吴昊阳 · 3D 测试页 =====
   纯3D: 仅网格
   投影贴图: 真实网格表面按参考相机投影源图(几何100%真实3D, 背面=精确源图, 非2D卡片)
   叠加卡片: TransformControls 自由校准(备用) */
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x202030);
var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.GridHelper(10, 20, 0x444466, 0x33334d));
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
var dirLight = new THREE.DirectionalLight(0xffffff, 0.9); dirLight.position.set(5, 10, 7.5); scene.add(dirLight);
var fillLight = new THREE.DirectionalLight(0xcdbff0, 0.3); fillLight.position.set(-3, 2, -5); scene.add(fillLight);

var modelRoot = null, billboard = null, srcTexOrig = null, srcTexCrop = null;
var projMeshes = [], projMaterial = null;
var currentMode = 'pure', currentUrl = './models/wuhaoyang.glb';
var flipped = false, mirrored = false;

// 参考相机（与源图拍摄角度一致）→ 用于把源图投影到真实网格背面
var projCam = new THREE.PerspectiveCamera(45, 1537 / 1023, 0.01, 100);
projCam.position.set(-1.229, 1.663, 1.543);
projCam.up.set(0, 1, 0);
projCam.lookAt(-0.002, 0.126, -0.120);
projCam.updateMatrixWorld(true);
projCam.updateProjectionMatrix();
var projVP = new THREE.Matrix4().multiplyMatrices(projCam.projectionMatrix, projCam.matrixWorldInverse);

projMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uViewProj: { value: projVP },
    uCamPos: { value: projCam.position.clone() },
    uSrc: { value: null },
    uFlipX: { value: 0.0 },
    uFlipY: { value: 1.0 }
  },
  vertexShader: [
    'varying vec3 vWorldPos;',
    'varying vec3 vWorldNormal;',
    'void main() {',
    '  vec4 wp = modelMatrix * vec4(position, 1.0);',
    '  vWorldPos = wp.xyz;',
    '  vWorldNormal = normalize(mat3(modelMatrix) * normal);',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'uniform mat4 uViewProj;',
    'uniform vec3 uCamPos;',
    'uniform sampler2D uSrc;',
    'uniform float uFlipX;',
    'uniform float uFlipY;',
    'varying vec3 vWorldPos;',
    'varying vec3 vWorldNormal;',
    'void main() {',
    '  vec4 clip = uViewProj * vec4(vWorldPos, 1.0);',
    '  if (clip.w <= 0.0) discard;',
    '  vec2 ndc = clip.xy / clip.w;',
    '  vec2 uv = ndc * 0.5 + 0.5;',
    '  float ux = (uFlipX > 0.5) ? (1.0 - uv.x) : uv.x;',
    '  float uy = (uFlipY > 0.5) ? (1.0 - uv.y) : uv.y;',
    '  vec2 uvTex = vec2(ux, uy);',
    '  vec3 N = normalize(vWorldNormal);',
    '  vec3 V = normalize(uCamPos - vWorldPos);',
    '  if (uvTex.x < 0.0 || uvTex.x > 1.0 || uvTex.y < 0.0 || uvTex.y > 1.0) discard;',
    '  if (dot(N, V) <= 0.0) discard;',
    '  vec4 src = texture2D(uSrc, uvTex);',
    '  if (src.a < 0.5) discard;',
    '  gl_FragColor = vec4(src.rgb, 1.0);',
    '}'
  ].join('\n'),
  side: THREE.DoubleSide,
  transparent: false,
  depthTest: true,
  depthWrite: false,
  polygonOffset: true,
  polygonOffsetFactor: -1,
  polygonOffsetUnits: -1
});

var transformControl = new THREE.TransformControls(camera, renderer.domElement);
transformControl.addEventListener('dragging-changed', function (e) { controls.enabled = !e.value; });
transformControl.setMode('translate');
scene.add(transformControl);

function disposeObj(obj) {
    obj.traverse(function (c) {
        if (c.geometry) c.geometry.dispose();
        if (c.material && c.material !== projMaterial) { if (Array.isArray(c.material)) c.material.forEach(function (m) { m.dispose(); }); else c.material.dispose(); }
    });
}
function ensureSrcTexture(cb) {
    // 投影采样必须用工整带留白的原始 source.png（UV 由参考相机算出，对应完整取景框）
    // 卡片备用才用裁后的 source_crop.png（更紧凑）
    var pending = 2;
    function done() { if (--pending <= 0) cb(srcTexCrop); }
    if (!srcTexOrig) {
        new THREE.TextureLoader().load('./models/source.png', function (t) {
            t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
            t.flipY = false; // 关闭flip：与 shader 内 `1.0 - uv.y` 自洽，避免投影上下颠倒
            srcTexOrig = t; projMaterial.uniforms.uSrc.value = t; done();
        });
    } else { done(); }
    if (!srcTexCrop) {
        new THREE.TextureLoader().load('./models/source_crop.png', function (t) {
            t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
            srcTexCrop = t; done();
        });
    } else { done(); }
}
function buildBillboard(size, center, box, tex) {
    var aspect = tex.image.width / tex.image.height;
    var planeW = size.x, planeH = planeW / aspect;
    var bMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthTest: false, depthWrite: false });
    billboard = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), bMat);
    var localBack = modelRoot.worldToLocal(new THREE.Vector3(center.x, center.y, box.max.z));
    billboard.position.copy(localBack); billboard.position.z += Math.max(size.z, size.y) * 0.01;
    billboard.renderOrder = 1000;
    modelRoot.add(billboard);
    if (currentMode === 'card') { transformControl.attach(billboard); transformControl.visible = true; }
}
function buildProjection() {
    projMeshes = [];
    var geoms = [];
    modelRoot.traverse(function (c) { if (c.isMesh && c.geometry) geoms.push(c.geometry); });
    geoms.forEach(function (g) {
        var pm = new THREE.Mesh(g, projMaterial);
        pm.renderOrder = 1000;
        modelRoot.add(pm);
        projMeshes.push(pm);
    });
}
function applyModeVisibility() {
    if (billboard) billboard.visible = (currentMode === 'card');
    projMeshes.forEach(function (m) { m.visible = (currentMode === 'proj'); });
    if (currentMode === 'card' && billboard) { transformControl.attach(billboard); transformControl.visible = true; }
    else { transformControl.detach(); transformControl.visible = false; }
}
function loadModel(url, btnId) {
    currentUrl = url;
    document.getElementById('m-v3').classList.toggle('active', btnId === 'm-v3');
    document.getElementById('m-v8').classList.toggle('active', btnId === 'm-v8');
    flatOn = false; savedMats = [];
    document.getElementById('btn-flat').classList.remove('active');
    transformControl.detach();
    if (modelRoot) { scene.remove(modelRoot); disposeObj(modelRoot); modelRoot = null; billboard = null; projMeshes = []; }
    document.getElementById('info').textContent = '加载中: ' + url.split('/').pop();
    new THREE.GLTFLoader().load(url, function (gltf) {
        modelRoot = gltf.scene; modelRoot.name = 'WuHaoYangRoot'; scene.add(modelRoot);
        var box = new THREE.Box3().setFromObject(modelRoot);
        var size = box.getSize(new THREE.Vector3());
        var center = box.getCenter(new THREE.Vector3());
        camera.up.set(0, 1, 0); camera.position.set(-1.229, 1.663, 1.543); controls.target.copy(center); controls.update();
        ensureSrcTexture(function (tex) {
            buildBillboard(size, center, box, tex);
            if (projMaterial.uniforms.uSrc.value) buildProjection();
            applyModeVisibility();
        });
        document.getElementById('info').textContent =
            '已加载 (' + size.x.toFixed(2) + '×' + size.y.toFixed(2) + '×' + size.z.toFixed(2) + ') · 模式:' + currentMode;
    }, undefined, function (err) {
        document.getElementById('info').textContent = '加载失败: ' + (err.message || err);
    });
}
var flatOn = false, savedMats = [];
function toggleFlat() {
    flatOn = !flatOn;
    document.getElementById('btn-flat').classList.toggle('active', flatOn);
    if (!modelRoot) return;
    if (flatOn) {
        savedMats = [];
        modelRoot.traverse(function (c) {
            if (c.isMesh && c.material && c.material.map) {
                savedMats.push([c, c.material]);
                c.material = new THREE.MeshBasicMaterial({ map: c.material.map, side: THREE.DoubleSide });
            }
        });
    } else {
        savedMats.forEach(function (p) { p[0].material = p[1]; });
        savedMats = [];
    }
}
function setMode(m) {
    currentMode = m;
    document.getElementById('btn-pure').classList.toggle('active', m === 'pure');
    document.getElementById('btn-proj').classList.toggle('active', m === 'proj');
    document.getElementById('btn-card').classList.toggle('active', m === 'card');
    document.getElementById('card-ctrl').style.display = (m === 'card') ? 'block' : 'none';
    document.getElementById('proj-ctrl').style.display = (m === 'proj') ? 'block' : 'none';
    applyModeVisibility();
    var names = { pure: '纯3D（仅网格）', proj: '投影贴图（真实表面，背面=精确源图）', card: '叠加卡片（校准用）' };
    document.getElementById('info').textContent = '模式:' + names[m];
}
var projFlipX = 0, projFlipY = 1;
function toggleFlipX() {
    projFlipX = projFlipX ? 0 : 1;
    projMaterial.uniforms.uFlipX.value = projFlipX;
    document.getElementById('p-flipx').classList.toggle('active', !!projFlipX);
}
function toggleFlipY() {
    projFlipY = projFlipY ? 0 : 1;
    projMaterial.uniforms.uFlipY.value = projFlipY;
    document.getElementById('p-flipy').classList.toggle('active', !!projFlipY);
}
// 投影相机基准（参考相机），滑块在其上做偏移/缩放，把源图压到网格表面
var basePos = new THREE.Vector3(-1.229, 1.663, 1.543);
var baseTgt = new THREE.Vector3(-0.002, 0.126, -0.120);
function updateProjCam() {
    var s = parseFloat(document.getElementById('ps').value);
    var ox = parseFloat(document.getElementById('px').value);
    var oy = parseFloat(document.getElementById('py').value);
    var oz = parseFloat(document.getElementById('pz').value);
    var dir = basePos.clone().sub(baseTgt).multiplyScalar(s);
    var np = baseTgt.clone().add(dir); np.x += ox; np.y += oy; np.z += oz;
    projCam.position.copy(np);
    projCam.up.set(0, 1, 0);
    projCam.lookAt(baseTgt);
    projCam.updateMatrixWorld(true);
    projCam.updateProjectionMatrix();
    projVP.multiplyMatrices(projCam.projectionMatrix, projCam.matrixWorldInverse); // 就地修改，uniform.uViewProj 指向同一对象
    projMaterial.uniforms.uCamPos.value.copy(projCam.position);
}
function copyProjParams() {
    var s = parseFloat(document.getElementById('ps').value);
    var ox = parseFloat(document.getElementById('px').value);
    var oy = parseFloat(document.getElementById('py').value);
    var oz = parseFloat(document.getElementById('pz').value);
    var text = '// 投影相机微调（基准 ' + basePos.toArray().map(function (n) { return n.toFixed(3); }).join(',') + '）\n' +
        'proj.offset.x=' + ox.toFixed(3) + '  proj.offset.y=' + oy.toFixed(3) + '  proj.offset.z=' + oz.toFixed(3) + '\n' +
        'proj.scale=' + s.toFixed(3) + '\n' +
        'proj.flipX=' + projFlipX + '  proj.flipY=' + projFlipY;
    navigator.clipboard.writeText(text).then(function () { alert('已复制投影参数:\n\n' + text); });
}
function setTC(mode) {
    transformControl.setMode(mode);
    document.getElementById('t-trans').classList.toggle('active', mode === 'translate');
    document.getElementById('t-rot').classList.toggle('active', mode === 'rotate');
    document.getElementById('t-scale').classList.toggle('active', mode === 'scale');
}
function flipY() { flipped = !flipped; if (billboard) billboard.scale.y = flipped ? -1 : 1; }
function mirrorX() { mirrored = !mirrored; if (billboard) billboard.scale.x = mirrored ? -1 : 1; }

function setView(mode) {
    if (!modelRoot) return;
    var box = new THREE.Box3().setFromObject(modelRoot);
    var c = box.getCenter(new THREE.Vector3());
    var s = box.getSize(new THREE.Vector3());
    var m = Math.max(s.x, s.y, s.z);
    if (mode === 'ref') { camera.up.set(0, 1, 0); camera.position.set(-1.229, 1.663, 1.543); controls.target.copy(c); }
    else if (mode === 'v5') {
        // 烘焙相机的 three.js 复现参数（position/target/up，与 v5/v7 烘焙投影严格一致）
        camera.up.set(0.42235733874325254, 0.8016594051750903, -0.4230324768904133);
        camera.position.set(-0.36960142681550734, 0.5568882232934612, 0.5767583116871128);
        controls.target.set(0.1098632475888437, -0.036764136403485526, -0.06953148540439047);
    }
    else if (mode === 'auto') { camera.up.set(0, 1, 0); camera.position.set(c.x + m * 1.2, c.y + m * 0.8, c.z + m * 1.5); controls.target.copy(c); }
    else if (mode === 'top') { camera.up.set(0, 0, -1); camera.position.set(c.x, c.y + m * 2.5, c.z + 0.001); controls.target.copy(c); }
    else if (mode === 'persp') { camera.up.set(0, 1, 0); camera.position.set(c.x + m * 1.5, c.y + m, c.z + m * 1.8); controls.target.copy(c); }
    else if (mode === 'side') { camera.up.set(0, 1, 0); camera.position.set(c.x + 0.001, c.y + m * 0.6, c.z + m * 2.5); controls.target.copy(c); }
    controls.update();
}
function copyCamParams() {
    var cp = camera.position, ct = controls.target;
    var text = 'camera.position.set(' + cp.x.toFixed(3) + ', ' + cp.y.toFixed(3) + ', ' + cp.z.toFixed(3) + ')\n' +
                'controls.target.set(' + ct.x.toFixed(3) + ', ' + ct.y.toFixed(3) + ', ' + ct.z.toFixed(3) + ')';
    navigator.clipboard.writeText(text).then(function () { alert('已复制:\n\n' + text); });
}
function copyAll() {
    var cp = camera.position, ct = controls.target;
    var b = billboard, p = b ? b.position : { x: 0, y: 0, z: 0 };
    var r = b ? b.rotation : { x: 0, y: 0, z: 0 };
    var s = b ? b.scale : { x: 1, y: 1, z: 1 };
    var text = '// 模型: ' + currentUrl.split('/').pop() + '\n' +
        'camera.position.set(' + cp.x.toFixed(3) + ', ' + cp.y.toFixed(3) + ', ' + cp.z.toFixed(3) + ')\n' +
        'controls.target.set(' + ct.x.toFixed(3) + ', ' + ct.y.toFixed(3) + ', ' + ct.z.toFixed(3) + ')\n' +
        'card.position.set(' + p.x.toFixed(4) + ', ' + p.y.toFixed(4) + ', ' + p.z.toFixed(4) + ')\n' +
        'card.rotation.set(' + (r.x * 180 / Math.PI).toFixed(2) + ', ' + (r.y * 180 / Math.PI).toFixed(2) + ', ' + (r.z * 180 / Math.PI).toFixed(2) + ')  // 度\n' +
        'card.scale.set(' + s.x.toFixed(3) + ', ' + s.y.toFixed(3) + ', ' + s.z.toFixed(3) + ')';
    navigator.clipboard.writeText(text).then(function () { alert('已复制全部参数:\n\n' + text); });
}
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
    var cp = camera.position, ct = controls.target;
    document.getElementById('cam-pos').textContent = 'x: ' + cp.x.toFixed(3) + '  y: ' + cp.y.toFixed(3) + '  z: ' + cp.z.toFixed(3);
    document.getElementById('cam-tgt').textContent = 'x: ' + ct.x.toFixed(3) + '  y: ' + ct.y.toFixed(3) + '  z: ' + ct.z.toFixed(3);
}
animate();
window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

if (/[?&]v8\b/.test(location.search)) loadModel('./models/wuhaoyang_v8.glb', 'm-v8');
else loadModel(currentUrl, 'm-v3');
</script>
</body>
</html>
