                            ' vec3 greenMain = vec3(0.055, 0.64, 0.34);',
                            ' vec3 greenCore = vec3(0.70, 0.90, 0.70);',
                            ' vec3 violet    = vec3(0.67, 0.42, 0.69);',
                            ' vec3 col = mix(greenDeep, greenMain, smoothstep(0.06, 0.62, intensity));',
                            ' col = mix(col, greenCore, smoothstep(0.62, 1.15, intensity));',
                            // 紫罗兰出现在光幕上部与光柱缝隙（与参考照片一致）
                            ' float violetAmt = smoothstep(0.42, 0.95, uv.y) * (0.30 + 0.40*(1.0 - rays));',
                            ' col = mix(col, violet, violetAmt * smoothstep(0.08, 0.50, intensity));',
                            ' float a = intensity * uAlpha;',
                            // 四边柔化，杜绝硬边
                            ' a *= smoothstep(0.0, 0.07, uv.x) * smoothstep(1.0, 0.93, uv.x);',
                            ' a *= smoothstep(0.0, 0.06, uv.y) * smoothstep(1.0, 0.88, uv.y);',
                            ' gl_FragColor = vec4(col * (0.80 + 0.55*smoothstep(0.5, 1.2, intensity)), clamp(a, 0.0, 1.0));',
                            '}'
                        ].join('\n'),
                    });
                    var mesh = new THREE.Mesh(ng, mat);
                    mesh.name = '__lab_aurora__';
                    mesh.renderOrder = 1;
                    mesh.frustumCulled = false;
                    mesh.scale.set(AURORA_W / 2, AURORA_H / 2, 1);
                    sc.add(mesh);
                    window.__labAurora = mesh;
                    window.__labAuroraOff = false;
                    updateAurora();
                } catch (e) { window.__labAuroraError = String(e).slice(0, 200); }
            }
            function mountWu(env, theme) {
                if (window.__labWuMesh || window.__labWuPending) return;
                try {
                    var THREE = env.THREE, sc = env.scene;
                    var img = new Image();
                    img.crossOrigin = 'anonymous';
                    // 真机结论：onload 内不要自己 new 纹理（时序早于 bundle 纹理系统就绪会静默失败），
                    // 改为"延迟重试"：onload 只存 img，rAF 循环里等 Grass_chunk 就绪后再 new。
                    // 缓存穿透：wu-2d.png 带时间戳，避免浏览器用旧透明图。
                    img.onload = function () { window.__labWuImg = img; };
                    img.src = './wu-2d.png?v=' + Date.now();
                    window.__labWuPending = { THREE: THREE, sc: sc, tries: 0 };
                } catch (e) { window.__labWuError = String(e).slice(0, 200); }
            }
            function pumpWu() {
                var pd = window.__labWuPending;
                if (!pd || window.__labWuMesh || !window.__labWuImg) return;
                if (pd.tries++ > 600) { window.__labWuError = 'wu pump timeout'; window.__labWuPending = null; return; }
                try {
                    var sc = window.__experience.scene || window.__experience.engine.scene;
                    // 几何构造器借用（真机结论）：Grass_chunk 的几何构造器是裸 BufferGeometry，
                    // new(w,h) 出来是空壳（attrs=[]），这就是地毯一直隐形的原因。
                    // 改借极光几何（独立 9x3.2 Plane，与主渲染无关）。
                    // 用户裁决极光先关后，极光不再挂载，改借 reveal 全屏 quad 的几何本体
                    // 是危险的（22版吃掉滤镜），故本轮改为"按 donor 顶点手写 Plane"：
                    // 复用 donor 的 position/uv/index 数组逐项复制，新 BufferGeometry 与
                    // 旧 bundle 零共享，既不断滤镜也不空壳。
                    var donor = null;
                    sc.traverse(function (o) { if (!donor && o.isMesh && o.geometry && o.geometry.type === 'PlaneGeometry') donor = o; });
                    if (!donor) return;
                    var grass = null;
                    sc.traverse(function (o) { if (!grass && o.name && o.name.indexOf('Grass_chunk') === 0) grass = o; });
                    if (!grass || !grass.material || !grass.material.uniforms || !grass.material.uniforms.uColorTexture) return;
                    var img = window.__labWuImg;
                    var aspect = img.naturalWidth / img.naturalHeight;
                    // 远景人影 2.2 米宽保证可见，等比不拉伸 YOUNG。
                    var w = 2.2, h = w / aspect;
                    var TexCtor = grass.material.uniforms.uColorTexture.value.constructor;
                    var tex = new TexCtor(img);
                    tex.needsUpdate = true;
                    // 真机实测（本轮）：人影发灰的根因就是上面被删掉的"借常量"逻辑。
                    // 人物原图是 sRGB PNG，必须写死 'srgb'；renderer.outputColorSpace 已是 'srgb'。
                    try { tex.colorSpace = 'srgb'; } catch (eCS) {}
                    try { tex.flipY = true; } catch (eFY) {}
                    var mat = new pd.THREE.ShaderMaterial({
                        // 深度测试打开：让前景草叶自然压住身体边缘，人才像"躺进草里"。
                        // 人物周边 1.4m 内的草块已清开，不会整身被埋。
                        transparent: true, depthWrite: false, depthTest: true, side: 2,
                        uniforms: {
                            uMap: { value: tex }, uHasTex: { value: 1 },
                            uTint: { value: new (pd.THREE.Vector3)(0.16, 0.13, 0.38) },
                            uTintAmt: { value: 0.18 },
                            uExposure: { value: 0.72 },
                            uBaseY: { value: 0.05 },
                            uRange: { value: 0.95 },
                        },
                        vertexShader: [
                            'varying vec2 vUv; varying float vGround;',
                            'uniform float uBaseY; uniform float uRange;',
                            'void main(){',
                            ' vUv = uv;',
                            ' vec4 wp = modelMatrix * vec4(position, 1.0);',
                            ' vGround = clamp((uBaseY + uRange - wp.y) / uRange, 0.0, 1.0);',
                            ' gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
                            '}',
                        ].join('\n'),
                        fragmentShader: [
                            'varying vec2 vUv; varying float vGround;',
                            'uniform sampler2D uMap; uniform vec3 uTint; uniform float uTintAmt; uniform float uExposure;',
                            'void main(){',
                            ' vec4 t = texture2D(uMap, vUv);',
                            ' float a = smoothstep(0.03, 0.32, t.a);',
                            ' if (a <= 0.004) discard;',
                            // 第 6 轮用户裁决：人太白认不出。原图是清晰动漫赛璐璐，
                            // 必须保色：不再整片染色/抬黑/压暗，只做极轻的环境融合。
                            ' vec3 c = t.rgb;',
                            // 极轻染色（8%），只让人物"吃到"一点环境色，不改本色
                            ' c = mix(c, c * (uTint * 1.6 + 0.25), uTintAmt * 0.35);',
                            // 曝光几乎不动（0.95~1.0），禁止压灰
                            ' c = c * uExposure;',
                            // 接地处只压暗 12%，保留球衣/肤色原色
                            ' c = c * (1.0 - 0.12 * vGround);',
                            ' gl_FragColor = vec4(c, a);',
                            '}',
                        ].join('\n'),
                    });
                    // donor 是 2x2 全屏 quad（uv 0~1 完整），目标宽 2.2 米：scale=1.1。
                    // 高按等比由着色器内 uv 保持（443x312→1.42:1），不拉伸 YOUNG。
                    // 真机结论2：donor.geometry.clone() 会退化为裸 BufferGeometry（attrs=[]），
                    // 因为 PlaneGeometry 子类 xi 的 clone 被 bundle 改写过。
                    // 真机结论3：直接复用 donor.geometry 本体会"吃掉" reveal 全屏滤镜
                    // （22版整个画面紫还带白边），故改借极光的几何：极光是独立 9x3.2 Plane，
                    // 与主渲染无关，复用它最安全。
                    // 本轮（极光已关）：按 donor 顶点手写新几何，零共享。
                    var dg = donor.geometry;
                    var dpos = dg.attributes.position.array.slice();
                    var duv = dg.attributes.uv.array.slice();
                    var didx = dg.index ? dg.index.array.slice() : null;
                    var GeoCtor = dg.constructor;
                    var ng = new GeoCtor();
                    var PosCtor = dg.attributes.position.constructor;
                    var UvCtor = dg.attributes.uv.constructor;
                    ng.setAttribute('position', new PosCtor(dpos, 3));
                    ng.setAttribute('uv', new UvCtor(duv, 2));
                    if (didx) {
                        try { ng.setIndex(Array.prototype.slice.call(didx)); } catch (eIdx) {}
                    }
                    var mesh = new pd.THREE.Mesh(ng, mat);
                    mesh.name = '__lab_wu_carpet__';
                    // 真机实测（本轮）最终参数（见文件顶部 WU_SCALE / WU_TILT / WU_POS）：
                    // - 等比：几何是 2x2 方形，原图 443x312=1.4199:1，故 scale.y = scale.x/1.4199，不拉伸。
                    // - 落点：相机左前方开阔草坪，贴地不悬空、不挂树干。
                    // - 姿态：绕相机方向倾斜，既保持趴姿又让正面对着相机可辨认。
                    mesh.scale.set(WU_SCALE, WU_SCALE / 1.4199, 1);
                    mesh.position.set(WU_POS[0], WU_POS[1], WU_POS[2]);
                    faceCamera(mesh, WU_TILT);
                    // 真机结论4：depthTest=false + renderOrder=10 强制最前，不被草片/地形吞没。
                    mesh.renderOrder = 10;
                    mesh.frustumCulled = false;
                    pd.sc.add(mesh);
                    window.__labWuMesh = mesh;
                    window.__labWuPending = null;
                    // 压草：只在人影投影范围内屏蔽草的指针交互（pressAt 按投影包围盒判定）。
                    window.__labWu3D = { ready: true, pressAt: pressAt };
                    // 人物就位后，按其轮廓重绘身下地面（解决悬空）
                    try { mountGroundPatch({ THREE: pd.THREE, scene: sc }); } catch (eG) { window.__labGroundError = String(eG).slice(0, 200); }
                    // 人物就位后再清身上杂物（relayout 时人物尚未生成）
                    try { if (window.__labClearClutterNearWu) window.__labClearClutterNearWu(); } catch (eC) {}
                } catch (e2) { if (pd.tries > 600) window.__labWuError = String(e2).slice(0, 200); }
            }
            function loop() {
                var exp = window.__experience;
                if (exp && exp.scene || exp && exp.engine && exp.engine.scene) {
                    if (!applied) {
                        applied = true;
                        try {
                            var q = new URLSearchParams(location.search).get('theme');
                            var theme = (q === 'dark' || q === 'light') ? q : 'light';
                            var DAY = ['#d9a441', '#9c6b1e', '#b08746', '#8a6a38'];
                            var NIGHT = ['#b07be0', '#7a3fa0', '#5e2d8a', '#2e1450'];
                            recolorGround(theme === 'dark' ? NIGHT : DAY, theme === 'dark');
                            // relayout/mount 延迟到 intro 相机落定后（4 秒），避免被开场动画覆盖。
                            setTimeout(function () {
                                try { relayout(); } catch (eR) { window.__labRelayoutError = String(eR).slice(0, 200); }
                                try {
                                    var env = borrow();
                                    if (env) { mountAurora(env); mountWu(env, theme); }
                                } catch (eM) { window.__labBError = String(eM).slice(0, 200); }
                            }, 4000);
                        } catch (e) { window.__labBError = String(e).slice(0, 200); }
                    }
                    if (window.__labAurora && window.__labAurora.material && window.__labAurora.material.uniforms) {
                        try {
                            var dark = (document.body.getAttribute('data-lab-theme') === 'dark');
                            var u = window.__labAurora.material.uniforms;
                            u.uTime.value += 0.016;
                            var target = dark ? 1.0 : 0.0;
                            u.uAlpha.value += (target - u.uAlpha.value) * 0.05;
                            // 关键修复（本轮真机定位）：相机上挂着一个全屏 reveal 遮罩 __reveal_mesh__，
                            // 它的 material.depthWrite 为 true，会先在深度缓冲里写入近处深度，
                            // 导致天空里任何 depthTest=true 的东西（极光）被整片挡掉（此前极光"看不见"的真因）。
                            // 它本就是全屏透明覆盖层，不该写深度；置 false 后极光可正常参与深度测试，
                            // 从而被树干/山体自然遮挡，而不是硬贴在画面最前。
                            var rm = window.__experience.revealMesh;
                            if (rm && rm.material && rm.material.depthWrite) rm.material.depthWrite = false;
                            // 极光跟随相机：每帧重算天空位置并正面朝向相机（视差下自然跟随）。
                            updateAurora();
                        } catch (e2) {}
                    }
                    try { pumpWu(); } catch (e3) {}
                    // 取景定稿：每帧锁 scout-08 机位（压过开场动画与鼠标视差）
                    try { lockScoutCamera(); } catch (eCam2) {}
                    // 人影姿态跟随相机：开场与鼠标视差会让相机微动，每帧重算朝向保证正面可辨。
                    if (window.__labWuMesh) { try { faceCamera(window.__labWuMesh, WU_TILT); } catch (e4) {} }
                    // 地面补片颜色跟随主题（夜晚紫 / 白天金）
                    if (window.__labWuGround) { try { updateGroundTheme(); } catch (e5) {} }
                    // 人物环境染色跟随主题：只做极轻融合，禁止洗白（第 6 轮）
                    if (window.__labWuMesh && window.__labWuMesh.material && window.__labWuMesh.material.uniforms && window.__labWuMesh.material.uniforms.uTint) {
                        try {
                            var isDark = (document.body.getAttribute('data-lab-theme') === 'dark');
                            var uu = window.__labWuMesh.material.uniforms;
                            // 夜晚只留 6% 紫光，白天 4% 暖光；曝光保持 0.95+，不压灰
                            if (isDark) { uu.uTint.value.set(0.35, 0.30, 0.55); uu.uTintAmt.value = 0.06; uu.uExposure.value = 0.95; }
                            else { uu.uTint.value.set(1.0, 0.85, 0.55); uu.uTintAmt.value = 0.04; uu.uExposure.value = 1.0; }
                        } catch (e6) {}
                    }
                }
                requestAnimationFrame(loop);
            }
            (function wait() {
                var ok = window.__experience && (window.__experience.scene || (window.__experience.engine && window.__experience.engine.scene));
                if (ok) { loop(); return; }
                setTimeout(wait, 200);
            })();
        })();
    </script>
</body>
