                            if (rm2) { rm2.visible = false; if (rm2.material) rm2.material.visible = false; }

                            updateAurora();
                        } catch (e2) {}
                    }
                    try { pumpWu(); } catch (e3) {}
                    // 取景定稿：每帧锁 scout-08 机位（压过开场动画与鼠标视差）
                    try { lockScoutCamera(); } catch (eCam2) {}

                    try { enforceCameraOnRender(); } catch (eCam3) {}

                    if (window.__labWuMesh) {

                                placeFacing(window.__labWuMesh);

                                if (!window.__labFlatDone && placeFlat(window.__labWuMesh)) window.__labFlatDone = true;
                            } else {

                    // 而引擎草是等密实例，不清就会把 1.44m 长的人埋掉。

                                // 用草块自身几何中心不可靠（多个 chunk 共享原点），
                                // 改用"该块是否有实例落在人物附近"判定：抽样前 400 个实例。
                                // 整块隐藏会产生"孤立绿斑"（第15轮实拍缺陷）：
                                // 人形轮廓外的草块被整块删掉，裸地上只剩零星草，形成
                                // 一块与周围不连续的绿岛。改为：草块保留，只把落在人物
                                // 正身范围内的实例矩阵压扁（草尖高度 → 0），视觉上等于
                                // 身体把草压住——这正是真实照片里的物理感。

                                // 不删除整块 —— 删整块会留下"孤立绿斑"（第15轮实拍缺陷）。
                                // instanceMatrix 是 4x4 列主序，Y 基向量在 [1],[5],[9]，
                                // 缩放分量 m11 位于索引 5。

                    if (window.__labWuGround) { try { updateGroundTheme(); } catch (e5) {} }
                    // 人物环境染色跟随主题：只做极轻融合，禁止洗白（第 6 轮）
                    if (window.__labWuMesh && window.__labWuMesh.material && window.__labWuMesh.material.uniforms && window.__labWuMesh.material.uniforms.uTint) {
                        try {

                            // 第 13 轮：提高环境融合、压低曝光——此前人物比夜色场景亮一个档、
                            // 对比度也更高，是"贴上去"违和感的主因之一。
                            if (isDark) { uu.uTint.value.set(0.42, 0.34, 0.62); uu.uTintAmt.value = 0.24; uu.uExposure.value = 0.86; }
                            else { uu.uTint.value.set(1.0, 0.86, 0.58); uu.uTintAmt.value = 0.14; uu.uExposure.value = 0.92; }
                        } catch (e6) {}

                    // 会在别处把 uRockColor/uDirtColor 写回原值，必须逐帧压住，
                    // 否则黑斑会在下一帧回来（这是"改完当帧有效、下一帧又黑"的真因）。
